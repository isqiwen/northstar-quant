syntax = "proto3";
package northstar.data_hub;
import "google/protobuf/struct.proto";
import "api_options.proto";
import "common.proto";
import "web_auth.proto";
import "accounting.proto";

message AdmissionRejection {
  option (northstar.web.evidence) = true;
  optional string reason = 1 [json_name = "reason", (northstar.web.required_field) = true];
  optional string rejection_id = 2 [json_name = "rejection_id", (northstar.web.required_field) = true];
  map<string, google.protobuf.Value> evidence_fields = 1000;
}

message DatasetDetails {
  optional string availability_basis = 1 [json_name = "availability_basis", (northstar.web.required_field) = true];
  optional string availability_note = 2 [json_name = "availability_note", (northstar.web.required_field) = true];
  optional int64 bar_count = 3 [json_name = "bar_count", (northstar.web.required_field) = true];
  optional string content_hash = 4 [json_name = "content_hash", (northstar.web.required_field) = true];
  optional string exchange = 5 [json_name = "exchange", (northstar.web.required_field) = true];
  repeated ImportSpecification import_specs = 6 [json_name = "import_specs", (northstar.web.required_field) = true];
  repeated string limitations = 7 [json_name = "limitations", (northstar.web.required_field) = true];
  optional google.protobuf.Struct processing_provenance = 8 [json_name = "processing_provenance", (northstar.web.nullable) = true];
  optional string product = 9 [json_name = "product", (northstar.web.required_field) = true];
  optional string published_at = 10 [json_name = "published_at", (northstar.web.required_field) = true];
  optional google.protobuf.Struct quality = 11 [json_name = "quality", (northstar.web.required_field) = true];
  optional google.protobuf.Struct semantics = 12 [json_name = "semantics", (northstar.web.required_field) = true];
  optional string session_close = 13 [json_name = "session_close", (northstar.web.required_field) = true];
  optional string session_open = 14 [json_name = "session_open", (northstar.web.required_field) = true];
  optional string snapshot_id = 15 [json_name = "snapshot_id", (northstar.web.required_field) = true];
  optional string source_reference = 16 [json_name = "source_reference", (northstar.web.required_field) = true];
  repeated google.protobuf.Struct sources = 17 [json_name = "sources", (northstar.web.required_field) = true];
  optional string symbol = 18 [json_name = "symbol", (northstar.web.required_field) = true];
  repeated string trading_days = 19 [json_name = "trading_days", (northstar.web.required_field) = true];
  repeated string null_fields = 2046;
  repeated northstar.accounting.SettlementFact settlements = 20 [json_name = "settlements", (northstar.web.required_field) = true];
  repeated northstar.accounting.FuturesTerms terms = 21 [json_name = "terms", (northstar.web.required_field) = true];
}

message DatasetLineage {
  repeated google.protobuf.Struct attempts = 1 [json_name = "attempts", (northstar.web.required_field) = true];
  optional string snapshot_id = 2 [json_name = "snapshot_id", (northstar.web.required_field) = true];
  repeated google.protobuf.Struct sources = 3 [json_name = "sources", (northstar.web.required_field) = true];
  repeated google.protobuf.Struct usages = 4 [json_name = "usages", (northstar.web.required_field) = true];
}

message DatasetSummary {
  optional int64 bar_count = 1 [json_name = "bar_count", (northstar.web.required_field) = true];
  optional string content_hash = 2 [json_name = "content_hash", (northstar.web.required_field) = true];
  optional string exchange = 3 [json_name = "exchange", (northstar.web.required_field) = true];
  optional string product = 4 [json_name = "product", (northstar.web.required_field) = true];
  optional string published_at = 5 [json_name = "published_at", (northstar.web.required_field) = true];
  optional string session_close = 6 [json_name = "session_close", (northstar.web.required_field) = true];
  optional string session_open = 7 [json_name = "session_open", (northstar.web.required_field) = true];
  optional string snapshot_id = 8 [json_name = "snapshot_id", (northstar.web.required_field) = true];
  optional string symbol = 9 [json_name = "symbol", (northstar.web.required_field) = true];
  repeated string trading_days = 10 [json_name = "trading_days", (northstar.web.required_field) = true];
}

message HttpError {
  optional string detail = 1 [json_name = "detail", (northstar.web.required_field) = true];
  optional string rejection_id = 2 [json_name = "rejection_id", (northstar.web.nullable) = true];
  optional string request_id = 3 [json_name = "request_id", (northstar.web.nullable) = true];
  optional string runtime_id = 4 [json_name = "runtime_id", (northstar.web.nullable) = true];
  optional string status = 5 [json_name = "status", (northstar.web.nullable) = true];
  optional string url = 6 [json_name = "url", (northstar.web.nullable) = true];
  repeated string null_fields = 2046;
}


message ImportSpecification {
  optional string session_kind = 16 [json_name = "session_kind", (northstar.web.required_field) = true, (northstar.web.allowed_values) = "[\"DAY\",\"NIGHT\"]"];
  optional string availability_basis = 1 [json_name = "availability_basis", (northstar.web.required_field) = true];
  optional string availability_note = 2 [json_name = "availability_note", (northstar.web.required_field) = true];
  optional string currency = 3 [json_name = "currency", (northstar.web.required_field) = true];
  optional string exchange = 4 [json_name = "exchange", (northstar.web.required_field) = true];
  optional string multiplier = 5 [json_name = "multiplier", (northstar.web.required_field) = true];
  optional string price_tick = 6 [json_name = "price_tick", (northstar.web.required_field) = true];
  optional string product = 7 [json_name = "product", (northstar.web.required_field) = true];
  optional string quantity_unit = 8 [json_name = "quantity_unit", (northstar.web.required_field) = true];
  optional string session_close = 9 [json_name = "session_close", (northstar.web.required_field) = true];
  optional string session_open = 10 [json_name = "session_open", (northstar.web.required_field) = true];
  optional string source_name = 11 [json_name = "source_name", (northstar.web.required_field) = true];
  optional string source_reference = 12 [json_name = "source_reference", (northstar.web.required_field) = true];
  optional string symbol = 13 [json_name = "symbol", (northstar.web.required_field) = true];
  optional string timezone = 14 [json_name = "timezone", (northstar.web.required_field) = true];
  optional string trading_day = 15 [json_name = "trading_day", (northstar.web.required_field) = true];
}

message ProcessingAttempt {
  option (northstar.web.evidence) = true;
  optional string attempt_id = 1 [json_name = "attempt_id", (northstar.web.required_field) = true];
  optional string created_at = 2 [json_name = "created_at", (northstar.web.required_field) = true];
  optional string error = 3 [json_name = "error", (northstar.web.required_field) = true, (northstar.web.nullable) = true];
  optional google.protobuf.Struct parameters = 4 [json_name = "parameters", (northstar.web.required_field) = true];
  optional string snapshot_id = 5 [json_name = "snapshot_id", (northstar.web.required_field) = true, (northstar.web.nullable) = true];
  optional string source_id = 6 [json_name = "source_id", (northstar.web.required_field) = true];
  optional string stage = 7 [json_name = "stage", (northstar.web.required_field) = true];
  optional string status = 8 [json_name = "status", (northstar.web.required_field) = true];
  map<string, google.protobuf.Value> evidence_fields = 1000;
  repeated string null_fields = 2046;
}

message Readiness {
  optional string status = 1 [json_name = "status", (northstar.web.required_field) = true, (northstar.web.allowed_values) = "[\"ready\"]"];
}


message SourceRecord {
  option (northstar.web.evidence) = true;
  optional bool allow_download = 1 [json_name = "allow_download", (northstar.web.required_field) = true];
  optional bool allow_retention = 2 [json_name = "allow_retention", (northstar.web.required_field) = true];
  optional int64 byte_count = 3 [json_name = "byte_count", (northstar.web.required_field) = true];
  optional string content_hash = 4 [json_name = "content_hash", (northstar.web.required_field) = true];
  optional string filename = 5 [json_name = "filename", (northstar.web.required_field) = true];
  optional string input_kind = 6 [json_name = "input_kind", (northstar.web.required_field) = true];
  optional string received_at = 7 [json_name = "received_at", (northstar.web.required_field) = true];
  optional string source_id = 8 [json_name = "source_id", (northstar.web.required_field) = true];
  optional string source_name = 9 [json_name = "source_name", (northstar.web.required_field) = true];
  map<string, google.protobuf.Value> evidence_fields = 1000;
}

message GetApiAttemptsResponse {
  option (northstar.web.root_array) = true;
  repeated ProcessingAttempt items = 1;
}

message GetApiDatasetsResponse {
  option (northstar.web.root_array) = true;
  repeated DatasetSummary items = 1;
}

message GetApiRejectionsResponse {
  option (northstar.web.root_array) = true;
  repeated AdmissionRejection items = 1;
}

message GetApiSourcesResponse {
  option (northstar.web.root_array) = true;
  repeated SourceRecord items = 1;
}

message ProcessingQueueStatus {
  optional string observed_at = 1 [json_name = "observed_at", (northstar.web.required_field) = true];
  optional int64 total = 2 [json_name = "total", (northstar.web.required_field) = true];
  optional int64 pending = 3 [json_name = "pending", (northstar.web.required_field) = true];
  optional int64 running = 4 [json_name = "running", (northstar.web.required_field) = true];
  optional int64 published = 5 [json_name = "published", (northstar.web.required_field) = true];
  optional int64 failed = 6 [json_name = "failed", (northstar.web.required_field) = true];
  optional string oldest_pending_id = 7 [json_name = "oldest_pending_id", (northstar.web.nullable) = true];
  optional string oldest_pending_at = 8 [json_name = "oldest_pending_at", (northstar.web.nullable) = true];
  optional int64 oldest_pending_seconds = 9 [json_name = "oldest_pending_seconds", (northstar.web.nullable) = true];
  repeated string null_fields = 2046;
}


message SyncSettingsRequest {
  optional int64 revision = 1 [(northstar.web.required_field) = true];
  optional bool enabled = 2 [(northstar.web.required_field) = true];
}
message SyncReprocessRequest {
  optional string request_id = 1 [(northstar.web.required_field) = true];
  optional string source_generation = 2 [(northstar.web.required_field) = true];
}
message SyncTokenRequest {
  optional string token = 1 [(northstar.web.required_field) = true];
}
message SyncStatus {
  optional google.protobuf.Struct settings = 1 [(northstar.web.required_field) = true];
  optional bool token_configured = 2 [json_name = "token_configured", (northstar.web.required_field) = true];
  repeated google.protobuf.Struct datasets = 3;
  repeated google.protobuf.Struct progress = 4;
  repeated google.protobuf.Struct jobs = 5;
  optional int64 unplanned_contracts = 6 [json_name = "unplanned_contracts", (northstar.web.required_field) = true];
}
message SyncEvidence {
  option (northstar.web.evidence) = true;
  optional string request_id = 1 [json_name = "request_id", (northstar.web.required_field) = true];
  map<string, google.protobuf.Value> evidence_fields = 1000;
}

message PublicationManifest {
  optional string snapshot_id = 1 [(northstar.web.required_field) = true];
  optional string storage_id = 2 [(northstar.web.required_field) = true];
  optional string path = 3 [(northstar.web.required_field) = true];
  optional string sha256 = 4 [(northstar.web.required_field) = true];
  optional int64 bytes = 5 [(northstar.web.required_field) = true];
  repeated google.protobuf.Struct files = 6 [(northstar.web.required_field) = true];
}
message PublicationCatalog {
  repeated string snapshots = 1 [(northstar.web.required_field) = true];
}
message ExplorerCatalog {
  repeated google.protobuf.Struct datasets = 1 [(northstar.web.required_field) = true];
  repeated string exchanges = 2 [(northstar.web.required_field) = true];
  repeated google.protobuf.Struct products = 3 [(northstar.web.required_field) = true];
}

message ContractSearch {
  optional string exchange = 1 [(northstar.web.required_field) = true];
  optional string product = 2 [(northstar.web.required_field) = true];
  optional string search = 3 [(northstar.web.required_field) = true];
  optional int64 offset = 4 [(northstar.web.required_field) = true];
}

message ExplorerList {
  repeated google.protobuf.Struct rows = 1 [(northstar.web.required_field) = true];
  optional int64 total = 2 [(northstar.web.required_field) = true];
}

message ExplorerRange {
  optional string dataset = 1 [(northstar.web.required_field) = true];
  optional string scope = 2 [(northstar.web.required_field) = true];
  optional string start = 3 [(northstar.web.required_field) = true];
  optional string end = 4 [(northstar.web.required_field) = true];
  optional int64 offset = 5 [(northstar.web.required_field) = true];
}

message ExplorerQuery {
  optional string dataset = 1 [(northstar.web.required_field) = true];
  optional string scope = 2 [(northstar.web.required_field) = true];
  optional string start = 3 [(northstar.web.required_field) = true];
  optional string end = 4 [(northstar.web.required_field) = true];
  optional int64 offset = 5 [(northstar.web.required_field) = true];
  repeated string receipt_ids = 6 [(northstar.web.required_field) = true];
  optional int64 limit = 7 [(northstar.web.required_field) = true];
}

message ExplorerCoverage {
  repeated google.protobuf.Struct days = 1 [(northstar.web.required_field) = true];
  repeated google.protobuf.Struct jobs = 2 [(northstar.web.required_field) = true];
  optional string note = 3 [(northstar.web.required_field) = true];
}

message ExplorerRows {
  repeated google.protobuf.Struct sources = 14 [(northstar.web.required_field) = true];
  optional bool export_allowed = 15 [(northstar.web.required_field) = true];
  optional string dataset = 1 [(northstar.web.required_field) = true];
  optional string scope = 2 [(northstar.web.required_field) = true];
  optional string start = 3 [(northstar.web.required_field) = true];
  optional string end = 4 [(northstar.web.required_field) = true];
  repeated string receipt_ids = 5 [(northstar.web.required_field) = true];
  optional string view_id = 6 [(northstar.web.required_field) = true];
  repeated google.protobuf.Struct rows = 7 [(northstar.web.required_field) = true];
  optional int64 total = 8 [(northstar.web.required_field) = true];
  optional int64 offset = 9 [(northstar.web.required_field) = true];
  optional int64 limit = 10 [(northstar.web.required_field) = true];
  repeated google.protobuf.Struct fields = 11 [(northstar.web.required_field) = true];
  repeated google.protobuf.Struct versions = 12 [(northstar.web.required_field) = true];
  optional string note = 13 [(northstar.web.required_field) = true];
  optional google.protobuf.Struct scan = 17 [(northstar.web.required_field) = true];
}

message RevisionRequest {
  optional string before_id = 1 [(northstar.web.required_field) = true];
  optional string after_id = 2 [(northstar.web.required_field) = true];
  optional int64 offset = 3 [(northstar.web.required_field) = true];
}
message RevisionComparison {
  optional string comparison_id = 1 [(northstar.web.required_field) = true];
  optional string rule = 2 [(northstar.web.required_field) = true];
  optional google.protobuf.Struct before = 3 [(northstar.web.required_field) = true];
  optional google.protobuf.Struct after = 4 [(northstar.web.required_field) = true];
  optional bool source_changed = 5 [(northstar.web.required_field) = true];
  optional bool rules_changed = 6 [(northstar.web.required_field) = true];
  optional google.protobuf.Struct counts = 7 [(northstar.web.required_field) = true];
  repeated google.protobuf.Struct changes = 8;
  optional int64 total = 9 [(northstar.web.required_field) = true];
  optional int64 offset = 10 [(northstar.web.required_field) = true];
  optional string note = 11 [(northstar.web.required_field) = true];
}

message CompactionRequest {
  optional string request_id = 1 [(northstar.web.required_field) = true];
  optional string dataset = 2 [(northstar.web.required_field) = true];
  optional string scope = 3 [(northstar.web.required_field) = true];
  optional string start = 4 [(northstar.web.required_field) = true];
  optional string end = 5 [(northstar.web.required_field) = true];
  repeated string receipt_ids = 6 [(northstar.web.required_field) = true];
}
message Compaction {
  optional string compaction_id = 1 [(northstar.web.required_field) = true];
  optional string plan_id = 2 [(northstar.web.required_field) = true];
  optional google.protobuf.Struct plan = 3 [(northstar.web.required_field) = true];
  optional string created_at = 4 [(northstar.web.required_field) = true];
  optional string status = 5 [(northstar.web.required_field) = true];
  optional google.protobuf.Struct result = 6 [(northstar.web.required_field) = true, (northstar.web.nullable) = true];
  optional string error = 7 [(northstar.web.required_field) = true, (northstar.web.nullable) = true];
  repeated string null_fields = 2046;
}
message CompactionPage {
  optional int64 offset = 1 [(northstar.web.required_field) = true];
  optional int64 limit = 2 [(northstar.web.required_field) = true];
}
message CompactionList { option (northstar.web.root_array) = true; repeated Compaction items = 1; }

service BrowserApi {
  rpc SubmitCompaction(CompactionRequest) returns (Compaction) { option (northstar.web.http_method) = "POST"; option (northstar.web.http_path) = "/api/explorer/compactions"; }
  rpc ListCompactions(northstar.web.Empty) returns (CompactionList) { option (northstar.web.http_method) = "GET"; option (northstar.web.http_path) = "/api/explorer/compactions"; }
  rpc GetCompaction(northstar.web.Empty) returns (Compaction) { option (northstar.web.http_method) = "GET"; option (northstar.web.http_path) = "/api/explorer/compactions/{compaction_id}"; }
  rpc ReadCompaction(CompactionPage) returns (ExplorerRows) { option (northstar.web.http_method) = "POST"; option (northstar.web.http_path) = "/api/explorer/compactions/{compaction_id}/query"; }
  rpc ExportCompaction(CompactionPage) returns (ExplorerRows) { option (northstar.web.http_method) = "POST"; option (northstar.web.http_path) = "/api/explorer/compactions/{compaction_id}/export"; }

  rpc PostApiLogin (northstar.web.auth.LoginRequest) returns (northstar.web.auth.BrowserSession) {
    option (northstar.web.http_method) = "POST";
    option (northstar.web.http_path) = "/api/login";
  }
  rpc PostApiLogout (northstar.web.Empty) returns (northstar.web.auth.BrowserSession) {
    option (northstar.web.http_method) = "POST";
    option (northstar.web.http_path) = "/api/logout";
  }
  rpc CompareRevisions (RevisionRequest) returns (RevisionComparison) {
    option (northstar.web.http_method) = "POST";
    option (northstar.web.http_path) = "/api/explorer/compare";
  }
  rpc ExportRows(ExplorerQuery) returns (ExplorerRows) { option (northstar.web.http_method) = "POST"; option (northstar.web.http_path) = "/api/explorer/export"; }
  rpc QueryRows(ExplorerQuery) returns (ExplorerRows) { option (northstar.web.http_method) = "POST"; option (northstar.web.http_path) = "/api/explorer/query"; }
  rpc QueryVersions(ExplorerRange) returns (ExplorerList) { option (northstar.web.http_method) = "POST"; option (northstar.web.http_path) = "/api/explorer/versions"; }
  rpc QueryCoverage(ExplorerRange) returns (ExplorerCoverage) { option (northstar.web.http_method) = "POST"; option (northstar.web.http_path) = "/api/explorer/coverage"; }
  rpc FindContracts(ContractSearch) returns (ExplorerList) { option (northstar.web.http_method) = "POST"; option (northstar.web.http_path) = "/api/explorer/contracts"; }
  rpc GetExplorer(northstar.web.Empty) returns (ExplorerCatalog) { option (northstar.web.http_method) = "GET"; option (northstar.web.http_path) = "/api/explorer"; }
  rpc GetApiPublications (northstar.web.Empty) returns (PublicationCatalog) {
    option (northstar.web.http_method) = "GET";
    option (northstar.web.http_path) = "/api/publications";
  }
  rpc GetApiPublicationsSnapshotId (northstar.web.Empty) returns (PublicationManifest) {
    option (northstar.web.http_method) = "GET";
    option (northstar.web.http_path) = "/api/publications/{snapshot_id}";
  }
  rpc GetApiSync (northstar.web.Empty) returns (SyncStatus) {
    option (northstar.web.http_method) = "GET";
    option (northstar.web.http_path) = "/api/sync";
  }
  rpc PostApiSyncSettings (SyncSettingsRequest) returns (SyncStatus) {
    option (northstar.web.http_method) = "POST";
    option (northstar.web.http_path) = "/api/sync/settings";
  }
  rpc ReprocessSync (SyncReprocessRequest) returns (SyncEvidence) {
    option (northstar.web.http_method) = "POST";
    option (northstar.web.http_path) = "/api/sync/reprocess";
  }
  rpc PostApiSyncToken (SyncTokenRequest) returns (SyncStatus) {
    option (northstar.web.http_method) = "POST";
    option (northstar.web.http_path) = "/api/sync/token";
  }
  rpc GetApiSyncJobsRequestId (northstar.web.Empty) returns (SyncEvidence) {
    option (northstar.web.http_method) = "GET";
    option (northstar.web.http_path) = "/api/sync/jobs/{request_id}";
  }
  rpc GetApiSyncReceiptsRequestId (northstar.web.Empty) returns (SyncEvidence) {
    option (northstar.web.http_method) = "GET";
    option (northstar.web.http_path) = "/api/sync/receipts/{request_id}";
  }

  rpc GetApiProcessingStatus (northstar.web.Empty) returns (ProcessingQueueStatus) {
    option (northstar.web.http_method) = "GET";
    option (northstar.web.http_path) = "/api/processing/status";
  }
  rpc GetApiAttempts (northstar.web.Empty) returns (GetApiAttemptsResponse) {
    option (northstar.web.http_method) = "GET";
    option (northstar.web.http_path) = "/api/attempts";
  }
  rpc GetApiAttemptsAttemptId (northstar.web.Empty) returns (ProcessingAttempt) {
    option (northstar.web.http_method) = "GET";
    option (northstar.web.http_path) = "/api/attempts/{attempt_id}";
  }
  rpc GetApiBrowserSession (northstar.web.Empty) returns (northstar.web.auth.BrowserSession) {
    option (northstar.web.http_method) = "GET";
    option (northstar.web.http_path) = "/api/browser-session";
  }
  rpc GetApiDatasets (northstar.web.Empty) returns (GetApiDatasetsResponse) {
    option (northstar.web.http_method) = "GET";
    option (northstar.web.http_path) = "/api/datasets";
  }
  rpc GetApiDatasetsSnapshotId (northstar.web.Empty) returns (DatasetDetails) {
    option (northstar.web.http_method) = "GET";
    option (northstar.web.http_path) = "/api/datasets/{snapshot_id}";
  }
  rpc GetApiDatasetsSnapshotIdLineage (northstar.web.Empty) returns (DatasetLineage) {
    option (northstar.web.http_method) = "GET";
    option (northstar.web.http_path) = "/api/datasets/{snapshot_id}/lineage";
  }
  rpc GetApiRejections (northstar.web.Empty) returns (GetApiRejectionsResponse) {
    option (northstar.web.http_method) = "GET";
    option (northstar.web.http_path) = "/api/rejections";
  }
  rpc GetApiSources (northstar.web.Empty) returns (GetApiSourcesResponse) {
    option (northstar.web.http_method) = "GET";
    option (northstar.web.http_path) = "/api/sources";
  }
  rpc GetApiSourcesSourceId (northstar.web.Empty) returns (SourceRecord) {
    option (northstar.web.http_method) = "GET";
    option (northstar.web.http_path) = "/api/sources/{source_id}";
  }
}
