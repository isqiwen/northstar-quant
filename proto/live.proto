service BrowserApi {
  rpc PostApiLogin (northstar.web.auth.LoginRequest) returns (northstar.web.auth.BrowserSession) {
    option (northstar.web.http_method) = "POST";
    option (northstar.web.http_path) = "/api/login";
  }
  rpc PostApiLogout (northstar.web.Empty) returns (northstar.web.auth.BrowserSession) {
    option (northstar.web.http_method) = "POST";
    option (northstar.web.http_path) = "/api/logout";
  }
  rpc GetApiLiveInstances (northstar.web.Empty) returns (InstanceCatalog) {
    option (northstar.web.http_method) = "GET";
    option (northstar.web.http_path) = "/api/live/instances";
  }
  rpc GetApiAttemptsAttemptId (northstar.web.Empty) returns (ArchiveAttempt) {
    option (northstar.web.http_method) = "GET";
    option (northstar.web.http_path) = "/api/attempts/{attempt_id}";
  }
  rpc PostApiBrokerBaselineChecks (BaselineCheckRequest) returns (CheckRecord) {
    option (northstar.web.http_method) = "POST";
    option (northstar.web.http_path) = "/api/broker/baseline-checks";
    option (northstar.web.runtime_required) = true;
  }
  rpc GetApiBrokerBaselineChecksCheckId (northstar.web.Empty) returns (CheckRecord) {
    option (northstar.web.http_method) = "GET";
    option (northstar.web.http_path) = "/api/broker/baseline-checks/{check_id}";
  }
