name: northstar-nas
services:
  postgres:
    networks:
    - storage
    - ingress
    image: postgres:17-alpine
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      POSTGRES_DB: northstar_quant
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: ${NORTHSTAR_NAS_DATABASE_PASSWORD:?Set a private URL-safe NAS database password}
    ports:
    - ${NORTHSTAR_NAS_BIND_ADDRESS:?Set the NAS private interface address}:${NORTHSTAR_NAS_DATABASE_PORT:-15432}:5432
    volumes:
    - database:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U northstar -d northstar_quant
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  initialize:
    networks:
    - storage
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
        NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
    image: ${NORTHSTAR_BACKEND_IMAGE:-northstar-quant:local}
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NORTHSTAR_DATABASE_URL: postgresql+psycopg://northstar:${NORTHSTAR_NAS_DATABASE_PASSWORD:?Set NAS database password}@postgres:5432/northstar_quant?connect_timeout=5
      NORTHSTAR_DATA_DIR: /var/lib/northstar/sources
      NORTHSTAR_STORAGE_ID: ${NORTHSTAR_STORAGE_ID:?Set the same source storage UUID on all three hosts}
    volumes:
    - type: bind
      source: ${NORTHSTAR_NAS_SHARE_DIR:?Set NAS shared directory}/sources
      target: /var/lib/northstar/sources
      bind:
        create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    command:
    - sh
    - -c
    - python -c 'import os; from pathlib import Path; from northstar_quant.data_management.storage_identity import initialize; initialize(Path(os.environ["NORTHSTAR_DATA_DIR"]), os.environ["NORTHSTAR_STORAGE_ID"])' && northstar maintenance init-db
networks:
  ingress:
  storage:
    internal: true
volumes:
  database:
