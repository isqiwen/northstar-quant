name: northstar-research
services:
  research-api:
    networks:
    - storage
    - frontend
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
        NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
    image: ${NORTHSTAR_BACKEND_IMAGE:-northstar-quant:local}
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NORTHSTAR_LOG_DIR: /var/log/northstar
      NORTHSTAR_DATABASE_URL: postgresql+psycopg://northstar:${NORTHSTAR_STORAGE_DATABASE_PASSWORD:-northstar_local}@postgres:5432/northstar_quant
      NORTHSTAR_DATA_DIR: /var/lib/northstar/sources
    volumes:
    - logs:/var/log/northstar
    - sources:/var/lib/northstar/sources:ro
    ports:
    - 127.0.0.1:${NORTHSTAR_RESEARCH_API_PORT:-19084}:19084
    command:
    - uvicorn
    - northstar_quant.apps.research:application
    - --factory
    - --host
    - 0.0.0.0
    - --port
    - '19084'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:19084/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
  research:
    networks:
    - frontend
    - ingress
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        APP: research
    image: ${NORTHSTAR_RESEARCH_FRONTEND_IMAGE:-northstar-research-frontend:local}
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NORTHSTAR_API_URL: http://research-api:19084
    ports:
    - 127.0.0.1:${NORTHSTAR_RESEARCH_WEB_PORT:-18084}:3000
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  logs: null
  sources:
    external: true
    name: ${NORTHSTAR_STORAGE_PROJECT:-northstar-storage}_sources
networks:
  storage:
    external: true
    name: ${NORTHSTAR_STORAGE_PROJECT:-northstar-storage}_storage
  frontend:
    internal: true
  ingress: null
