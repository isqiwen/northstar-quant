name: northstar-research
services:
  storage-check:
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
        NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
    image: ${NORTHSTAR_BACKEND_IMAGE:-northstar-quant:local}
    environment:
      NORTHSTAR_LOG_DIR: /var/log/northstar
      NORTHSTAR_DATABASE_OWNER: research
      NORTHSTAR_MARKET_DIR: /var/lib/northstar/market
      NORTHSTAR_MARKET_STORAGE_ID: ${NORTHSTAR_MARKET_STORAGE_ID:-}
      NORTHSTAR_RESEARCH_DIR: /var/lib/northstar/research
      NORTHSTAR_RESEARCH_STORAGE_ID: ${NORTHSTAR_RESEARCH_STORAGE_ID:-}
      NORTHSTAR_RESEARCH_DATABASE: /var/lib/northstar/state/research.sqlite3
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    - type: bind
      source: /opt/northstar/files/market
      target: /var/lib/northstar/market
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /opt/northstar/files/research
      target: /var/lib/northstar/research
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /opt/northstar/state/research
      target: /var/lib/northstar/state
      read_only: false
      bind:
        create_host_path: false
    networks:
    - egress
    command:
    - python
    - -m
    - northstar_quant.apps.mounts
    depends_on:
      initialize:
        condition: service_completed_successfully
  research-api:
    networks:
    - egress
    - frontend
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
        NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
    image: ${NORTHSTAR_BACKEND_IMAGE:-northstar-quant:local}
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NORTHSTAR_LOG_DIR: /var/log/northstar
      TMPDIR: /var/lib/northstar/work
      NORTHSTAR_DATABASE_OWNER: research
      NORTHSTAR_MARKET_DIR: /var/lib/northstar/market
      NORTHSTAR_MARKET_STORAGE_ID: ${NORTHSTAR_MARKET_STORAGE_ID:-}
      NORTHSTAR_RESEARCH_DIR: /var/lib/northstar/research
      NORTHSTAR_RESEARCH_STORAGE_ID: ${NORTHSTAR_RESEARCH_STORAGE_ID:-}
      NORTHSTAR_DATA_HUB_URL: ${NORTHSTAR_DATA_HUB_URL:-http://core.local:19090}
      NORTHSTAR_RESEARCH_DATABASE: /var/lib/northstar/state/research.sqlite3
    volumes:
    - type: bind
      source: /opt/northstar/logs/research
      target: /var/log/northstar/research
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /opt/northstar/work/research
      target: /var/lib/northstar/work
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /opt/northstar/files/market
      target: /var/lib/northstar/market
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /opt/northstar/files/research
      target: /var/lib/northstar/research
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /opt/northstar/state/research
      target: /var/lib/northstar/state
      read_only: false
      bind:
        create_host_path: false
    ports:
    - 127.0.0.1:${NORTHSTAR_RESEARCH_API_PORT:-19084}:19084
    command:
    - uvicorn
    - northstar_quant.apps.research:application
    - --factory
    - --host
    - 0.0.0.0
    - --port
    - '19084'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:19084/health/ready',
        timeout=3)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      storage-check:
        condition: service_completed_successfully
  research:
    networks:
    - frontend
    - ingress
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        APP: research
    image: ${NORTHSTAR_RESEARCH_FRONTEND_IMAGE:-northstar-research-frontend:local}
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NORTHSTAR_API_URL: http://research-api:19084
    ports:
    - 0.0.0.0:${NORTHSTAR_RESEARCH_WEB_PORT:-18084}:3000
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
  maintenance:
    networks:
    - egress
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
        NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
    image: ${NORTHSTAR_BACKEND_IMAGE:-northstar-quant:local}
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NORTHSTAR_LOG_DIR: /var/log/northstar
      TMPDIR: /var/lib/northstar/work
      NORTHSTAR_DATABASE_OWNER: research
      NORTHSTAR_MARKET_DIR: /var/lib/northstar/market
      NORTHSTAR_MARKET_STORAGE_ID: ${NORTHSTAR_MARKET_STORAGE_ID:-}
      NORTHSTAR_RESEARCH_DIR: /var/lib/northstar/research
      NORTHSTAR_RESEARCH_STORAGE_ID: ${NORTHSTAR_RESEARCH_STORAGE_ID:-}
      NORTHSTAR_BACKUP_DIR: /var/lib/northstar/backup
      NORTHSTAR_BACKUP_STORAGE_ID: ${NORTHSTAR_BACKUP_STORAGE_ID:-}
      NORTHSTAR_RESEARCH_DATABASE: /var/lib/northstar/state/research.sqlite3
      NORTHSTAR_DATA_HUB_URL: ${NORTHSTAR_DATA_HUB_URL:-http://core.local:19090}
    volumes:
    - type: bind
      source: /opt/northstar/logs/research
      target: /var/log/northstar/research
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /opt/northstar/work/research
      target: /var/lib/northstar/work
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /opt/northstar/files/market
      target: /var/lib/northstar/market
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /opt/northstar/files/research
      target: /var/lib/northstar/research
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /opt/northstar/files/backup
      target: /var/lib/northstar/backup
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /opt/northstar/state/research
      target: /var/lib/northstar/state
      read_only: false
      bind:
        create_host_path: false
    command:
    - northstar
    - maintenance
    - backup
    - /var/lib/northstar/backup/manual
    extra_hosts:
    - host.docker.internal:host-gateway
    profiles:
    - maintenance
  initialize:
    networks:
    - egress
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
        NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
    image: ${NORTHSTAR_BACKEND_IMAGE:-northstar-quant:local}
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NORTHSTAR_DATABASE_OWNER: research
      NORTHSTAR_RESEARCH_DATABASE: /var/lib/northstar/state/research.sqlite3
    command:
    - northstar
    - maintenance
    - init-db
    volumes:
    - type: bind
      source: /opt/northstar/state/research
      target: /var/lib/northstar/state
      read_only: false
      bind:
        create_host_path: false
  research-worker:
    networks:
    - egress
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
        NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
    image: ${NORTHSTAR_BACKEND_IMAGE:-northstar-quant:local}
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NORTHSTAR_LOG_DIR: /var/log/northstar
      TMPDIR: /var/lib/northstar/work
      NORTHSTAR_DATABASE_OWNER: research
      NORTHSTAR_MARKET_DIR: /var/lib/northstar/market
      NORTHSTAR_MARKET_STORAGE_ID: ${NORTHSTAR_MARKET_STORAGE_ID:-}
      NORTHSTAR_RESEARCH_DIR: /var/lib/northstar/research
      NORTHSTAR_RESEARCH_STORAGE_ID: ${NORTHSTAR_RESEARCH_STORAGE_ID:-}
      NORTHSTAR_DATA_HUB_URL: ${NORTHSTAR_DATA_HUB_URL:-http://core.local:19090}
      NORTHSTAR_RESEARCH_DATABASE: /var/lib/northstar/state/research.sqlite3
    volumes:
    - type: bind
      source: /opt/northstar/logs/research
      target: /var/log/northstar/research
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /opt/northstar/work/research
      target: /var/lib/northstar/work
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /opt/northstar/files/market
      target: /var/lib/northstar/market
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /opt/northstar/files/research
      target: /var/lib/northstar/research
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /opt/northstar/state/research
      target: /var/lib/northstar/state
      read_only: false
      bind:
        create_host_path: false
    command:
    - northstar
    - serve
    - research-worker
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      storage-check:
        condition: service_completed_successfully
networks:
  frontend:
    internal: true
  ingress: null
  egress: null
