name: northstar-live

x-runtime: &runtime
  image: ${NORTHSTAR_LIVE_IMAGE:-northstar-quant:local}
  build:
    context: ../..
    dockerfile: backend/Dockerfile
    args:
      NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
      NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
  platform: linux/amd64
  logging: &logging
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

x-database: &database
  NORTHSTAR_DATABASE_URL: postgresql+psycopg://northstar:${NORTHSTAR_LIVE_DATABASE_PASSWORD:-northstar_local}@postgres:5432/northstar_quant
  NORTHSTAR_DATA_DIR: /var/lib/northstar/sources

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: ${NORTHSTAR_LIVE_DATABASE_MEMORY:-1g}
    pids_limit: 128
    logging: *logging
    environment:
      POSTGRES_DB: northstar_quant
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: ${NORTHSTAR_LIVE_DATABASE_PASSWORD:-northstar_local}
    volumes:
      - type: bind
        source: /opt/northstar/state/live/postgresql
        target: /var/lib/postgresql/data
        read_only: false
        bind:
          create_host_path: false
    networks: [storage]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar -d northstar_quant"]
      interval: 2s
      timeout: 3s
      retries: 30

  initialize:
    <<: *runtime
    mem_limit: 512m
    pids_limit: 64
    environment: *database
    volumes:
      - type: bind
        source: /opt/northstar/state/live/sources
        target: /var/lib/northstar/sources
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: /opt/northstar/credentials/live
        target: /var/lib/northstar/auth
        read_only: false
        bind:
          create_host_path: false
    networks: [storage]
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "northstar maintenance init-db && northstar maintenance init-auth /var/lib/northstar/auth && python -c 'from northstar_quant.data_management.files import SourceFiles; SourceFiles.from_environment()'"]

  live:
    <<: *runtime
    restart: unless-stopped
    mem_limit: ${NORTHSTAR_LIVE_KERNEL_MEMORY:-1g}
    memswap_limit: ${NORTHSTAR_LIVE_KERNEL_MEMORY:-1g}
    pids_limit: 128
    stop_grace_period: 30s
    environment:
      <<: *database
      NORTHSTAR_LOG_DIR: /var/log/northstar
      NORTHSTAR_LIVE_ENVIRONMENT: ${NORTHSTAR_LIVE_ENVIRONMENT:-simulation}
      NORTHSTAR_SIMNOW_USER_ID: ${NORTHSTAR_SIMNOW_USER_ID:-}
      NORTHSTAR_SIMNOW_APP_ID: ${NORTHSTAR_SIMNOW_APP_ID:-}
      NORTHSTAR_SIMNOW_AUTH_CODE: ${NORTHSTAR_SIMNOW_AUTH_CODE:-}
      NORTHSTAR_SIMNOW_PASSWORD: ${NORTHSTAR_SIMNOW_PASSWORD:-}
      NORTHSTAR_LIVE_AUTH: /var/lib/northstar/auth/live.toml
      NORTHSTAR_LIVE_URL: http://127.0.0.1:18081
    volumes:
      - type: bind
        source: /opt/northstar/logs/live
        target: /var/log/northstar/live
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: /opt/northstar/state/live/sources
        target: /var/lib/northstar/sources
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: /opt/northstar/credentials/live
        target: /var/lib/northstar/auth
        read_only: true
        bind:
          create_host_path: false
    networks: [storage, management, egress]
    depends_on:
      initialize:
        condition: service_completed_successfully
    command: ["uvicorn", "northstar_quant.apps.live.kernel:application", "--factory", "--host", "0.0.0.0", "--port", "18081"]
    healthcheck:
      test: ["CMD", "northstar", "status"]
      interval: 10s
      timeout: 8s
      retries: 3
      start_period: 20s

  live-api:
    <<: *runtime
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    environment:
      NORTHSTAR_LOG_DIR: /var/log/northstar
      NORTHSTAR_LIVE_URL: http://live:18081
      NORTHSTAR_LIVE_AUTH: /var/lib/northstar/auth/live-web.toml
    volumes:
      - type: bind
        source: /opt/northstar/logs/live
        target: /var/log/northstar/live
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: /opt/northstar/credentials/live
        target: /var/lib/northstar/auth
        read_only: true
        bind:
          create_host_path: false
    networks: [management, frontend]
    ports:
      - "127.0.0.1:${NORTHSTAR_LIVE_API_PORT:-19080}:19080"
    depends_on:
      initialize:
        condition: service_completed_successfully
    command: ["uvicorn", "northstar_quant.apps.live:application", "--factory", "--host", "0.0.0.0", "--port", "19080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19080/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  live-web:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        APP: live
    image: ${NORTHSTAR_LIVE_FRONTEND_IMAGE:-northstar-live-frontend:local}
    restart: unless-stopped
    logging: *logging
    environment:
      NORTHSTAR_API_URL: http://live-api:19080
    networks: [frontend, ingress]
    ports:
      - "0.0.0.0:${NORTHSTAR_LIVE_WEB_PORT:-18080}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  storage:
    internal: true
  management:
    internal: true
  frontend:
    internal: true
  egress:
  ingress:
