name: northstar-database
services:
  postgres:
    networks:
    - storage
    - ingress
    image: postgres:17-alpine
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: northstar_admin
      POSTGRES_PASSWORD: ${NORTHSTAR_NAS_ADMIN_PASSWORD:?Set private administrator password}
    ports:
    - ${NORTHSTAR_NAS_BIND_ADDRESS:?Set the NAS private interface address}:${NORTHSTAR_NAS_DATABASE_PORT:-15432}:5432
    volumes:
    - type: bind
      source: ${NORTHSTAR_NAS_PGDATA:?Set NAS local database directory}
      target: /var/lib/postgresql/data
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U northstar_admin -d postgres
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  initialize:
    networks:
    - storage
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
        NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
    image: ${NORTHSTAR_BACKEND_IMAGE:-northstar-quant:local}
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NORTHSTAR_NAS_ADMIN_PASSWORD: ${NORTHSTAR_NAS_ADMIN_PASSWORD:?Set administrator password}
      NORTHSTAR_DATA_HUB_DATABASE_PASSWORD: ${NORTHSTAR_DATA_HUB_DATABASE_PASSWORD:?Set distinct DATA_HUB password}
      NORTHSTAR_RESEARCH_DATABASE_PASSWORD: ${NORTHSTAR_RESEARCH_DATABASE_PASSWORD:?Set distinct RESEARCH password}
      NORTHSTAR_LIVE_DATABASE_PASSWORD: ${NORTHSTAR_LIVE_DATABASE_PASSWORD:?Set distinct LIVE password}
      NORTHSTAR_SOURCE_DIR: /var/lib/northstar/source
      NORTHSTAR_SOURCE_STORAGE_ID: ${NORTHSTAR_SOURCE_STORAGE_ID:?Set SOURCE storage UUID}
      NORTHSTAR_MARKET_DIR: /var/lib/northstar/market
      NORTHSTAR_MARKET_STORAGE_ID: ${NORTHSTAR_MARKET_STORAGE_ID:?Set MARKET storage UUID}
      NORTHSTAR_RESEARCH_DIR: /var/lib/northstar/research
      NORTHSTAR_RESEARCH_STORAGE_ID: ${NORTHSTAR_RESEARCH_STORAGE_ID:?Set RESEARCH storage UUID}
      NORTHSTAR_BACKUP_DIR: /var/lib/northstar/backup
      NORTHSTAR_BACKUP_STORAGE_ID: ${NORTHSTAR_BACKUP_STORAGE_ID:?Set BACKUP storage UUID}
    volumes:
    - type: bind
      source: ${NORTHSTAR_NAS_SOURCE_DIR:?Set verified NAS native SOURCE directory}
      target: /var/lib/northstar/source
      bind:
        create_host_path: false
    - type: bind
      source: ${NORTHSTAR_NAS_MARKET_DIR:?Set verified NAS native MARKET directory}
      target: /var/lib/northstar/market
      bind:
        create_host_path: false
    - type: bind
      source: ${NORTHSTAR_NAS_RESEARCH_DIR:?Set verified NAS native RESEARCH directory}
      target: /var/lib/northstar/research
      bind:
        create_host_path: false
    - type: bind
      source: ${NORTHSTAR_NAS_BACKUP_DIR:?Set verified NAS native BACKUP directory}
      target: /var/lib/northstar/backup
      bind:
        create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    command:
    - python
    - -m
    - northstar_quant.apps.provisioning
  backup:
    networks:
    - storage
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
        NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
    image: ${NORTHSTAR_BACKEND_IMAGE:-northstar-quant:local}
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NORTHSTAR_NAS_ADMIN_PASSWORD: ${NORTHSTAR_NAS_ADMIN_PASSWORD:?Set administrator password}
      NORTHSTAR_DATA_HUB_DATABASE_PASSWORD: ${NORTHSTAR_DATA_HUB_DATABASE_PASSWORD:?Set distinct DATA_HUB password}
      NORTHSTAR_RESEARCH_DATABASE_PASSWORD: ${NORTHSTAR_RESEARCH_DATABASE_PASSWORD:?Set distinct RESEARCH password}
      NORTHSTAR_LIVE_DATABASE_PASSWORD: ${NORTHSTAR_LIVE_DATABASE_PASSWORD:?Set distinct LIVE password}
      NORTHSTAR_SOURCE_DIR: /var/lib/northstar/source
      NORTHSTAR_SOURCE_STORAGE_ID: ${NORTHSTAR_SOURCE_STORAGE_ID:?Set SOURCE storage UUID}
      NORTHSTAR_MARKET_DIR: /var/lib/northstar/market
      NORTHSTAR_MARKET_STORAGE_ID: ${NORTHSTAR_MARKET_STORAGE_ID:?Set MARKET storage UUID}
      NORTHSTAR_RESEARCH_DIR: /var/lib/northstar/research
      NORTHSTAR_RESEARCH_STORAGE_ID: ${NORTHSTAR_RESEARCH_STORAGE_ID:?Set RESEARCH storage UUID}
      NORTHSTAR_BACKUP_DIR: /var/lib/northstar/backup
      NORTHSTAR_BACKUP_STORAGE_ID: ${NORTHSTAR_BACKUP_STORAGE_ID:?Set BACKUP storage UUID}
    volumes:
    - type: bind
      source: ${NORTHSTAR_NAS_SOURCE_DIR:?Set verified NAS native SOURCE directory}
      target: /var/lib/northstar/source
      bind:
        create_host_path: false
      read_only: true
    - type: bind
      source: ${NORTHSTAR_NAS_MARKET_DIR:?Set verified NAS native MARKET directory}
      target: /var/lib/northstar/market
      bind:
        create_host_path: false
      read_only: true
    - type: bind
      source: ${NORTHSTAR_NAS_RESEARCH_DIR:?Set verified NAS native RESEARCH directory}
      target: /var/lib/northstar/research
      bind:
        create_host_path: false
      read_only: true
    - type: bind
      source: ${NORTHSTAR_NAS_BACKUP_DIR:?Set verified NAS native BACKUP directory}
      target: /var/lib/northstar/backup
      bind:
        create_host_path: false
      read_only: false
    depends_on:
      postgres:
        condition: service_healthy
    command:
    - python
    - -m
    - northstar_quant.apps.nas_backup
    profiles:
    - maintenance
networks:
  ingress: null
  storage:
    internal: true
