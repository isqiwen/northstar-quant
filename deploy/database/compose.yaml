name: northstar-database
services:
  postgres:
    networks:
    - storage
    image: postgres:17-alpine
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: northstar_admin
      POSTGRES_PASSWORD: ${NORTHSTAR_DATABASE_ADMIN_PASSWORD:?Set private administrator
        password}
    volumes:
    - type: bind
      source: /opt/northstar/state/data-hub/postgresql
      target: /var/lib/postgresql/data
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U northstar_admin -d postgres
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  initialize:
    networks:
    - storage
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
        NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
    image: ${NORTHSTAR_BACKEND_IMAGE:-northstar-quant:local}
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NORTHSTAR_DATA_HUB_DATABASE_PASSWORD: ${NORTHSTAR_DATA_HUB_DATABASE_PASSWORD:?Set
        distinct DATA_HUB password}
      NORTHSTAR_SOURCE_DIR: /var/lib/northstar/source
      NORTHSTAR_SOURCE_STORAGE_ID: ${NORTHSTAR_SOURCE_STORAGE_ID:-}
      NORTHSTAR_MARKET_DIR: /var/lib/northstar/market
      NORTHSTAR_MARKET_STORAGE_ID: ${NORTHSTAR_MARKET_STORAGE_ID:-}
      NORTHSTAR_RESEARCH_DIR: /var/lib/northstar/research
      NORTHSTAR_RESEARCH_STORAGE_ID: ${NORTHSTAR_RESEARCH_STORAGE_ID:-}
      NORTHSTAR_BACKUP_DIR: /var/lib/northstar/backup
      NORTHSTAR_BACKUP_STORAGE_ID: ${NORTHSTAR_BACKUP_STORAGE_ID:-}
      NORTHSTAR_DATABASE_ADMIN_PASSWORD: ${NORTHSTAR_DATABASE_ADMIN_PASSWORD:?Set
        administrator password}
      NORTHSTAR_DATABASE_OWNER: data_hub
    volumes:
    - type: bind
      source: /opt/northstar/files/source
      target: /var/lib/northstar/source
      bind:
        create_host_path: false
    - type: bind
      source: /opt/northstar/files/market
      target: /var/lib/northstar/market
      bind:
        create_host_path: false
    - type: bind
      source: /opt/northstar/files/research
      target: /var/lib/northstar/research
      bind:
        create_host_path: false
    - type: bind
      source: /opt/northstar/files/backup
      target: /var/lib/northstar/backup
      bind:
        create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    command:
    - python
    - -m
    - northstar_quant.apps.provisioning
  backup:
    networks:
    - storage
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
        NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
    image: ${NORTHSTAR_BACKEND_IMAGE:-northstar-quant:local}
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NORTHSTAR_DATA_HUB_DATABASE_PASSWORD: ${NORTHSTAR_DATA_HUB_DATABASE_PASSWORD:?Set
        distinct DATA_HUB password}
      NORTHSTAR_SOURCE_DIR: /var/lib/northstar/source
      NORTHSTAR_SOURCE_STORAGE_ID: ${NORTHSTAR_SOURCE_STORAGE_ID:-}
      NORTHSTAR_MARKET_DIR: /var/lib/northstar/market
      NORTHSTAR_MARKET_STORAGE_ID: ${NORTHSTAR_MARKET_STORAGE_ID:-}
      NORTHSTAR_RESEARCH_DIR: /var/lib/northstar/research
      NORTHSTAR_RESEARCH_STORAGE_ID: ${NORTHSTAR_RESEARCH_STORAGE_ID:-}
      NORTHSTAR_BACKUP_DIR: /var/lib/northstar/backup
      NORTHSTAR_BACKUP_STORAGE_ID: ${NORTHSTAR_BACKUP_STORAGE_ID:-}
      NORTHSTAR_DATABASE_ADMIN_PASSWORD: ${NORTHSTAR_DATABASE_ADMIN_PASSWORD:?Set
        administrator password}
      NORTHSTAR_DATABASE_OWNER: data_hub
    volumes:
    - type: bind
      source: /opt/northstar/files/source
      target: /var/lib/northstar/source
      bind:
        create_host_path: false
      read_only: true
    - type: bind
      source: /opt/northstar/files/market
      target: /var/lib/northstar/market
      bind:
        create_host_path: false
      read_only: true
    - type: bind
      source: /opt/northstar/files/research
      target: /var/lib/northstar/research
      bind:
        create_host_path: false
      read_only: true
    - type: bind
      source: /opt/northstar/files/backup
      target: /var/lib/northstar/backup
      bind:
        create_host_path: false
      read_only: false
    depends_on:
      postgres:
        condition: service_healthy
    command:
    - python
    - -m
    - northstar_quant.apps.database_backup
    profiles:
    - maintenance
networks:
  storage:
    name: ${NORTHSTAR_DATA_DATABASE_NETWORK:-northstar-data-storage}
    internal: true
