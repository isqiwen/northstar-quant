name: northstar-data-hub
services:
  storage-check:
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
        NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
    image: ${NORTHSTAR_BACKEND_IMAGE:-northstar-quant:local}
    environment:
      NORTHSTAR_NAS_ADDRESS: ${NORTHSTAR_NAS_ADDRESS:?Set NAS IP}
      NORTHSTAR_NFS_EXPORT: ${NORTHSTAR_NFS_EXPORT:?Set the verified QNAP NFS export path}
      NORTHSTAR_NFS_VERSION: ${NORTHSTAR_NFS_VERSION:-4}
      NORTHSTAR_LOG_DIR: /var/log/northstar
      NORTHSTAR_DATABASE_URL: postgresql+psycopg://northstar:${NORTHSTAR_NAS_DATABASE_PASSWORD:?Set NAS database password}@nas.local:${NORTHSTAR_NAS_DATABASE_PORT:-15432}/northstar_quant?connect_timeout=5
      NORTHSTAR_DATA_DIR: /var/lib/northstar/sources
      NORTHSTAR_STORAGE_ID: ${NORTHSTAR_STORAGE_ID:?Set the source storage UUID initialized on nas.local}
    extra_hosts:
    - nas.local:${NORTHSTAR_NAS_ADDRESS:?Set the NAS IP reachable from this Docker host}
    volumes:
    - type: bind
      source: ${NORTHSTAR_NAS_MOUNT:-/mnt/northstar}/sources
      target: /var/lib/northstar/sources
      read_only: false
      bind:
        create_host_path: false
    networks:
    - egress
    command:
    - python
    - -c
    - from northstar_quant.apps.storage import open_database, require_current_database; from northstar_quant.data_management.files import SourceFiles; engine=open_database(); require_current_database(engine); engine.dispose(); files=SourceFiles.from_environment(); import os; from northstar_quant.data_management.storage_identity import probe; probe(files.root, os.environ["NORTHSTAR_STORAGE_ID"]); print("NAS database and source mount verified")
  data-api:
    networks:
    - egress
    - frontend
    platform: linux/amd64
    build: &id001
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
        NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
    image: ${NORTHSTAR_BACKEND_IMAGE:-northstar-quant:local}
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NORTHSTAR_LOG_DIR: /var/log/northstar
      NORTHSTAR_DATABASE_URL: postgresql+psycopg://northstar:${NORTHSTAR_NAS_DATABASE_PASSWORD:?Set NAS database password}@nas.local:${NORTHSTAR_NAS_DATABASE_PORT:-15432}/northstar_quant?connect_timeout=5
      NORTHSTAR_DATA_DIR: /var/lib/northstar/sources
      NORTHSTAR_STORAGE_ID: ${NORTHSTAR_STORAGE_ID:?Set the source storage UUID initialized on nas.local}
    volumes:
    - logs:/var/log/northstar
    - type: bind
      source: ${NORTHSTAR_NAS_MOUNT:-/mnt/northstar}/sources
      target: /var/lib/northstar/sources
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${NORTHSTAR_NAS_MOUNT:-/mnt/northstar}/backups
      target: /var/lib/northstar/backups
      bind:
        create_host_path: false
    ports:
    - 127.0.0.1:${NORTHSTAR_DATA_API_PORT:-19082}:19082
    command:
    - uvicorn
    - northstar_quant.apps.data_hub:application
    - --factory
    - --host
    - 0.0.0.0
    - --port
    - '19082'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:19082/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    extra_hosts:
    - nas.local:${NORTHSTAR_NAS_ADDRESS:?Set the NAS IP reachable from this Docker host}
    depends_on:
      storage-check:
        condition: service_completed_successfully
  data-worker:
    networks:
    - egress
    platform: linux/amd64
    build: *id001
    image: ${NORTHSTAR_BACKEND_IMAGE:-northstar-quant:local}
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NORTHSTAR_LOG_DIR: /var/log/northstar
      NORTHSTAR_DATABASE_URL: postgresql+psycopg://northstar:${NORTHSTAR_NAS_DATABASE_PASSWORD:?Set NAS database password}@nas.local:${NORTHSTAR_NAS_DATABASE_PORT:-15432}/northstar_quant?connect_timeout=5
      NORTHSTAR_DATA_DIR: /var/lib/northstar/sources
      NORTHSTAR_STORAGE_ID: ${NORTHSTAR_STORAGE_ID:?Set the source storage UUID initialized on nas.local}
    volumes:
    - logs:/var/log/northstar
    - type: bind
      source: ${NORTHSTAR_NAS_MOUNT:-/mnt/northstar}/sources
      target: /var/lib/northstar/sources
      read_only: false
      bind:
        create_host_path: false
    command:
    - northstar
    - serve
    - data-worker
    stop_grace_period: 60s
    extra_hosts:
    - nas.local:${NORTHSTAR_NAS_ADDRESS:?Set the NAS IP reachable from this Docker host}
    depends_on:
      storage-check:
        condition: service_completed_successfully
  data-hub:
    networks:
    - frontend
    - ingress
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        APP: data_hub
    image: ${NORTHSTAR_DATA_FRONTEND_IMAGE:-northstar-data_hub-frontend:local}
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NORTHSTAR_API_URL: http://data-api:19082
    ports:
    - 127.0.0.1:${NORTHSTAR_DATA_WEB_PORT:-18082}:3000
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  logs: null
networks:
  frontend:
    internal: true
  ingress: null
  egress: null
