name: northstar-data-hub
services:
  storage-check:
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
        NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
    image: ${NORTHSTAR_BACKEND_IMAGE:-northstar-quant:local}
    environment:
      NORTHSTAR_NAS_ADDRESS: ${NORTHSTAR_NAS_ADDRESS:-nas.local}
      NORTHSTAR_NFS_VERSION: ${NORTHSTAR_NFS_VERSION:-4}
      NORTHSTAR_LOG_DIR: /var/log/northstar
      NORTHSTAR_DATABASE_URL: postgresql+psycopg://northstar_data_hub_app:${NORTHSTAR_DATA_HUB_DATABASE_PASSWORD:?Set
        application password}@${NORTHSTAR_NAS_ADDRESS:-nas.local}:${NORTHSTAR_NAS_DATABASE_PORT:-15432}/northstar_data_hub?connect_timeout=5
      NORTHSTAR_DATABASE_OWNER: data_hub
      NORTHSTAR_SOURCE_DIR: /var/lib/northstar/source
      NORTHSTAR_SOURCE_STORAGE_ID: ${NORTHSTAR_SOURCE_STORAGE_ID:?Set source storage UUID}
      NORTHSTAR_SOURCE_NFS_EXPORT: ${NORTHSTAR_SOURCE_NFS_EXPORT:?Set verified source NFS export}
      NORTHSTAR_MARKET_DIR: /var/lib/northstar/market
      NORTHSTAR_MARKET_STORAGE_ID: ${NORTHSTAR_MARKET_STORAGE_ID:?Set market storage UUID}
      NORTHSTAR_MARKET_NFS_EXPORT: ${NORTHSTAR_MARKET_NFS_EXPORT:?Set verified market NFS export}
      NORTHSTAR_RESEARCH_DIR: /var/lib/northstar/research
      NORTHSTAR_RESEARCH_STORAGE_ID: ${NORTHSTAR_RESEARCH_STORAGE_ID:?Set research storage UUID}
      NORTHSTAR_RESEARCH_NFS_EXPORT: ${NORTHSTAR_RESEARCH_NFS_EXPORT:?Set verified research NFS export}
      NORTHSTAR_DATA_DIR: /var/lib/northstar/source
      NORTHSTAR_STORAGE_ID: ${NORTHSTAR_SOURCE_STORAGE_ID:?Set source storage UUID}
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    - type: bind
      source: ${NORTHSTAR_SOURCE_MOUNT:-/mnt/northstar/source}
      target: /var/lib/northstar/source
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${NORTHSTAR_MARKET_MOUNT:-/mnt/northstar/market}
      target: /var/lib/northstar/market
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${NORTHSTAR_RESEARCH_MOUNT:-/mnt/northstar/research}
      target: /var/lib/northstar/research
      read_only: true
      bind:
        create_host_path: false
    networks:
    - egress
    command:
    - python
    - -m
    - northstar_quant.apps.mounts
  data-api:
    networks:
    - egress
    - frontend
    platform: linux/amd64
    build: &id001
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
        NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
    image: ${NORTHSTAR_BACKEND_IMAGE:-northstar-quant:local}
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NORTHSTAR_DATA_SECRET_DIR: /var/lib/northstar/credentials/private
      NORTHSTAR_LOG_DIR: /var/log/northstar
      NORTHSTAR_DATABASE_URL: postgresql+psycopg://northstar_data_hub_app:${NORTHSTAR_DATA_HUB_DATABASE_PASSWORD:?Set
        application password}@${NORTHSTAR_NAS_ADDRESS:-nas.local}:${NORTHSTAR_NAS_DATABASE_PORT:-15432}/northstar_data_hub?connect_timeout=5
      NORTHSTAR_DATABASE_OWNER: data_hub
      NORTHSTAR_SOURCE_DIR: /var/lib/northstar/source
      NORTHSTAR_SOURCE_STORAGE_ID: ${NORTHSTAR_SOURCE_STORAGE_ID:?Set source storage UUID}
      NORTHSTAR_SOURCE_NFS_EXPORT: ${NORTHSTAR_SOURCE_NFS_EXPORT:?Set verified source NFS export}
      NORTHSTAR_MARKET_DIR: /var/lib/northstar/market
      NORTHSTAR_MARKET_STORAGE_ID: ${NORTHSTAR_MARKET_STORAGE_ID:?Set market storage UUID}
      NORTHSTAR_MARKET_NFS_EXPORT: ${NORTHSTAR_MARKET_NFS_EXPORT:?Set verified market NFS export}
      NORTHSTAR_RESEARCH_DIR: /var/lib/northstar/research
      NORTHSTAR_RESEARCH_STORAGE_ID: ${NORTHSTAR_RESEARCH_STORAGE_ID:?Set research storage UUID}
      NORTHSTAR_RESEARCH_NFS_EXPORT: ${NORTHSTAR_RESEARCH_NFS_EXPORT:?Set verified research NFS export}
      NORTHSTAR_DATA_DIR: /var/lib/northstar/source
      NORTHSTAR_STORAGE_ID: ${NORTHSTAR_SOURCE_STORAGE_ID:?Set source storage UUID}
      NORTHSTAR_NAS_ADDRESS: ${NORTHSTAR_NAS_ADDRESS:-nas.local}
      NORTHSTAR_NFS_VERSION: ${NORTHSTAR_NFS_VERSION:-4}
    volumes:
    - credentials:/var/lib/northstar/credentials
    - logs:/var/log/northstar
    - type: bind
      source: ${NORTHSTAR_SOURCE_MOUNT:-/mnt/northstar/source}
      target: /var/lib/northstar/source
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${NORTHSTAR_MARKET_MOUNT:-/mnt/northstar/market}
      target: /var/lib/northstar/market
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${NORTHSTAR_RESEARCH_MOUNT:-/mnt/northstar/research}
      target: /var/lib/northstar/research
      read_only: true
      bind:
        create_host_path: false
    ports:
    - 127.0.0.1:${NORTHSTAR_DATA_API_PORT:-19082}:19082
    command:
    - uvicorn
    - northstar_quant.apps.data_hub:application
    - --factory
    - --host
    - 0.0.0.0
    - --port
    - '19082'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:19082/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      storage-check:
        condition: service_completed_successfully
  data-worker:
    networks:
    - egress
    platform: linux/amd64
    build: *id001
    image: ${NORTHSTAR_BACKEND_IMAGE:-northstar-quant:local}
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NORTHSTAR_DATA_SECRET_DIR: /var/lib/northstar/credentials/private
      NORTHSTAR_LOG_DIR: /var/log/northstar
      NORTHSTAR_DATABASE_URL: postgresql+psycopg://northstar_data_hub_app:${NORTHSTAR_DATA_HUB_DATABASE_PASSWORD:?Set
        application password}@${NORTHSTAR_NAS_ADDRESS:-nas.local}:${NORTHSTAR_NAS_DATABASE_PORT:-15432}/northstar_data_hub?connect_timeout=5
      NORTHSTAR_DATABASE_OWNER: data_hub
      NORTHSTAR_SOURCE_DIR: /var/lib/northstar/source
      NORTHSTAR_SOURCE_STORAGE_ID: ${NORTHSTAR_SOURCE_STORAGE_ID:?Set source storage UUID}
      NORTHSTAR_SOURCE_NFS_EXPORT: ${NORTHSTAR_SOURCE_NFS_EXPORT:?Set verified source NFS export}
      NORTHSTAR_MARKET_DIR: /var/lib/northstar/market
      NORTHSTAR_MARKET_STORAGE_ID: ${NORTHSTAR_MARKET_STORAGE_ID:?Set market storage UUID}
      NORTHSTAR_MARKET_NFS_EXPORT: ${NORTHSTAR_MARKET_NFS_EXPORT:?Set verified market NFS export}
      NORTHSTAR_RESEARCH_DIR: /var/lib/northstar/research
      NORTHSTAR_RESEARCH_STORAGE_ID: ${NORTHSTAR_RESEARCH_STORAGE_ID:?Set research storage UUID}
      NORTHSTAR_RESEARCH_NFS_EXPORT: ${NORTHSTAR_RESEARCH_NFS_EXPORT:?Set verified research NFS export}
      NORTHSTAR_DATA_DIR: /var/lib/northstar/source
      NORTHSTAR_STORAGE_ID: ${NORTHSTAR_SOURCE_STORAGE_ID:?Set source storage UUID}
      NORTHSTAR_NAS_ADDRESS: ${NORTHSTAR_NAS_ADDRESS:-nas.local}
      NORTHSTAR_NFS_VERSION: ${NORTHSTAR_NFS_VERSION:-4}
    volumes:
    - credentials:/var/lib/northstar/credentials:ro
    - logs:/var/log/northstar
    - type: bind
      source: ${NORTHSTAR_SOURCE_MOUNT:-/mnt/northstar/source}
      target: /var/lib/northstar/source
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${NORTHSTAR_MARKET_MOUNT:-/mnt/northstar/market}
      target: /var/lib/northstar/market
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${NORTHSTAR_RESEARCH_MOUNT:-/mnt/northstar/research}
      target: /var/lib/northstar/research
      read_only: true
      bind:
        create_host_path: false
    command:
    - northstar
    - serve
    - data-worker
    stop_grace_period: 60s
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      storage-check:
        condition: service_completed_successfully
  data-hub:
    networks:
    - frontend
    - ingress
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        APP: data_hub
    image: ${NORTHSTAR_DATA_FRONTEND_IMAGE:-northstar-data_hub-frontend:local}
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NORTHSTAR_API_URL: http://data-api:19082
    ports:
    - 127.0.0.1:${NORTHSTAR_DATA_WEB_PORT:-18082}:3000
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
  maintenance:
    networks:
    - egress
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
        NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
    image: ${NORTHSTAR_BACKEND_IMAGE:-northstar-quant:local}
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    environment:
      NORTHSTAR_LOG_DIR: /var/log/northstar
      NORTHSTAR_DATABASE_URL: postgresql+psycopg://northstar_data_hub_app:${NORTHSTAR_DATA_HUB_DATABASE_PASSWORD:?Set
        application password}@${NORTHSTAR_NAS_ADDRESS:-nas.local}:${NORTHSTAR_NAS_DATABASE_PORT:-15432}/northstar_data_hub?connect_timeout=5
      NORTHSTAR_DATABASE_OWNER: data_hub
      NORTHSTAR_SOURCE_DIR: /var/lib/northstar/source
      NORTHSTAR_SOURCE_STORAGE_ID: ${NORTHSTAR_SOURCE_STORAGE_ID:?Set source storage UUID}
      NORTHSTAR_SOURCE_NFS_EXPORT: ${NORTHSTAR_SOURCE_NFS_EXPORT:?Set verified source NFS export}
      NORTHSTAR_MARKET_DIR: /var/lib/northstar/market
      NORTHSTAR_MARKET_STORAGE_ID: ${NORTHSTAR_MARKET_STORAGE_ID:?Set market storage UUID}
      NORTHSTAR_MARKET_NFS_EXPORT: ${NORTHSTAR_MARKET_NFS_EXPORT:?Set verified market NFS export}
      NORTHSTAR_RESEARCH_DIR: /var/lib/northstar/research
      NORTHSTAR_RESEARCH_STORAGE_ID: ${NORTHSTAR_RESEARCH_STORAGE_ID:?Set research storage UUID}
      NORTHSTAR_RESEARCH_NFS_EXPORT: ${NORTHSTAR_RESEARCH_NFS_EXPORT:?Set verified research NFS export}
      NORTHSTAR_BACKUP_DIR: /var/lib/northstar/backup
      NORTHSTAR_BACKUP_STORAGE_ID: ${NORTHSTAR_BACKUP_STORAGE_ID:?Set backup storage UUID}
      NORTHSTAR_BACKUP_NFS_EXPORT: ${NORTHSTAR_BACKUP_NFS_EXPORT:?Set verified backup NFS export}
      NORTHSTAR_DATA_DIR: /var/lib/northstar/source
      NORTHSTAR_STORAGE_ID: ${NORTHSTAR_SOURCE_STORAGE_ID:?Set source storage UUID}
      NORTHSTAR_NAS_ADDRESS: ${NORTHSTAR_NAS_ADDRESS:-nas.local}
      NORTHSTAR_NFS_VERSION: ${NORTHSTAR_NFS_VERSION:-4}
    volumes:
    - logs:/var/log/northstar
    - type: bind
      source: ${NORTHSTAR_SOURCE_MOUNT:-/mnt/northstar/source}
      target: /var/lib/northstar/source
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${NORTHSTAR_MARKET_MOUNT:-/mnt/northstar/market}
      target: /var/lib/northstar/market
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ${NORTHSTAR_RESEARCH_MOUNT:-/mnt/northstar/research}
      target: /var/lib/northstar/research
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${NORTHSTAR_BACKUP_MOUNT:-/mnt/northstar/backup}
      target: /var/lib/northstar/backup
      read_only: false
      bind:
        create_host_path: false
    command:
    - northstar
    - maintenance
    - backup
    - /var/lib/northstar/backup/manual
    extra_hosts:
    - host.docker.internal:host-gateway
    profiles:
    - maintenance
volumes:
  credentials: null
  logs: null
networks:
  frontend:
    internal: true
  ingress: null
  egress: null
