services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在本地 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: northstar
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - northstar_postgres_data:/var/lib/postgresql/data
      - ./scripts/db/01_create_test_database.sql:/docker-entrypoint-initdb.d/01_create_test_database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar -d northstar"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  northstar_postgres_data:
