# Synthetic input for learning the workflow, not historical market evidence.
[archive]
use_basis = "Synthetic engineering example generated for this application; local retention and download permitted."
allow_retention = true
allow_download = true
input_kind = "RECEIVED_CSV"

[source]
file = "intraday.csv"
exchange = "SIM"
symbol = "RB2605"
product = "RB"
timezone = "Asia/Shanghai"
currency = "CNY"
quantity_unit = "TON"
price_tick = "1"
multiplier = "10"
trading_day = "2026-01-07"
session_kind = "DAY"
session_open = "2026-01-07T01:00:00Z"
session_close = "2026-01-07T01:12:00Z"
source_name = "synthetic_intraday_demo"
source_reference = "Project-generated synthetic intraday example; not market observations."
availability_basis = "SYNTHETIC"
availability_note = "Generated bar times and availability are solely for deterministic engineering checks."

[research.strategy]
strategy_id = "trend.momentum"

[research.strategy.factor_bindings.momentum]
factor_id = "trend.return"
parameters = { window_bars = 1 }

[research.strategy.parameters]
threshold = "0.005"
target_fraction = "0.5"
# Leave time for a complete post-order minute and its explicit delivery delay.
order_lifetime_seconds = 180

[research.risk]
max_lots = 10
max_gross_notional = "1000000"
max_margin_fraction = "0.5"
initial_margin_fraction = "0.1"
max_adverse_price_move_fraction = "0.1"

[research.simulation]
initial_cash = "100000"
fee_per_lot = "2"
slippage_ticks = 1
