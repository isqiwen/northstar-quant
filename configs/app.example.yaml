# 完整的非秘密应用配置示例。
# 此文件只用于展示和初始化，运行时绝不读取它。请复制为 configs/app.yaml 后编辑；
# 开发与生产环境都只读取完整的 app.yaml，二者字段结构必须完全一致。
# 数据库密码、令牌等秘密仍只放在 .env 或操作系统环境变量中。

# 运行输出目录的唯一真源。相对路径相对于项目根目录。
runtime:
  # 标准行情、下载缓存、模拟账户状态等本地持久化文件根目录。
  storage_dir: storage
  # null 表示自动使用 storage_dir/downloads；只有需要独立磁盘时才填写路径。
  downloads_dir: null
  # 回测、日报和 PDF 等正式报告制品根目录。
  reports_dir: reports
  # JSON Lines 审计日志根目录。
  log_dir: logs

# 统一日志设置。日志是运行审计的一部分，不应关闭文件日志来规避问题追踪。
logging:
  # Python 日志最低级别；INFO 适合日常运行，排障时可临时调整为 DEBUG。
  level: INFO
  # 是否输出人类可读的控制台日志。
  console_enabled: true
  # 是否写入 JSON Lines 审计日志；正式运行建议保持 true。
  file_enabled: true
  # 当前活动日志文件名；轮转后的文件会带日期后缀。
  filename: northstar.log
  # 按什么周期轮转；midnight 表示每天午夜切换新文件。
  when: midnight
  # 轮转间隔，和 when 配合使用；1 表示每个周期轮转一次。
  interval: 1
  # 保留的历史日志文件数量，超过后自动清理最旧文件。
  backup_count: 14
  # 文件编码，确保中文日志可读。
  encoding: utf-8
  # 控制台日志格式；文件日志统一使用结构化 JSON Lines。
  format: "%(asctime)s | %(levelname)-8s | %(filename)s:%(lineno)d | %(message)s"
