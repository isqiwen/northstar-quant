# 国内五个受支持交易所的连续合约研究主数据。
#
# 每条记录描述项目内部连续研究序列，而非 CTP 可直接下单的具体月份合约。乘数和最小
# 变动价位用于研究口径校验；实际交易前必须以交易所当日规则与期货公司合约查询结果为准。
version: 1
# 仅支持 SHFE（上期所）、DCE（大商所）、CZCE（郑商所）、GFEX（广期所）和 INE（能源中心）。
contracts:
  # 螺纹钢主力连续；上期所，10 吨/手，最小变动 1 元/吨。
  - symbol: RB_CONT
    # 项目内部研究 symbol；后缀 _CONT 明确表示连续序列，不能作为 CTP instrument_id。
    # 对应的实际期货品种代码；真实合约会是 RB 加交割年月。
    product: RB
    # 交易所标准代码；由加载器限制为当前支持的五个交易所之一。
    exchange: SHFE
    # continuous 表示跨月份研究序列；tradable 表示实际合约规格。
    contract_kind: continuous
    # 每手标的数量，用于把价格变动换算为每手盈亏。
    multiplier: 10
    # 报价最小变化单位，单位随该品种报价单位而定。
    tick_size: 1.0
    # 连续序列永远不得设为 true；实际合约须另建经核验映射。
    tradable: false
  # 铜主力连续；上期所，5 吨/手，最小变动 10 元/吨。
  - symbol: CU_CONT
    product: CU
    exchange: SHFE
    contract_kind: continuous
    multiplier: 5
    tick_size: 10.0
    tradable: false
  # 铁矿石主力连续；大商所，100 吨/手，最小变动 0.5 元/吨。
  - symbol: I_CONT
    product: I
    exchange: DCE
    contract_kind: continuous
    multiplier: 100
    tick_size: 0.5
    tradable: false
  # 豆粕主力连续；大商所，10 吨/手，最小变动 1 元/吨。
  - symbol: M_CONT
    product: M
    exchange: DCE
    contract_kind: continuous
    multiplier: 10
    tick_size: 1.0
    tradable: false
  # PTA 主力连续；郑商所交易代码为 TA，5 吨/手，最小变动 2 元/吨。
  - symbol: TA_CONT
    product: TA
    exchange: CZCE
    contract_kind: continuous
    multiplier: 5
    tick_size: 2.0
    tradable: false
  # 纯碱主力连续；郑商所，20 吨/手，最小变动 1 元/吨。
  - symbol: SA_CONT
    product: SA
    exchange: CZCE
    contract_kind: continuous
    multiplier: 20
    tick_size: 1.0
    tradable: false
  # 工业硅主力连续；广期所，5 吨/手，最小变动 5 元/吨。
  - symbol: SI_CONT
    product: SI
    exchange: GFEX
    contract_kind: continuous
    multiplier: 5
    tick_size: 5.0
    tradable: false
  # 原油主力连续；能源中心，1000 桶/手，最小变动 0.1 元/桶。
  - symbol: SC_CONT
    product: SC
    exchange: INE
    contract_kind: continuous
    multiplier: 1000
    tick_size: 0.1
    tradable: false
