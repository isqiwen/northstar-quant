# 本地 CTP 语义仿真画像，不连接任何期货公司交易前置。
profile_id: cn_futures_daily_trend_simulated
name: 中国商品期货日线 CTP 语义仿真
market: CN
asset_type: FUTURES
data_frequency: 1d
rebalance_frequency: 1d
strategy_family: trend_following
currency: CNY
timezone: Asia/Shanghai
# 仅作逻辑日历标识。真实/仿真主执行都不再用 XSHG 或工作日推断期货会话。
calendar: CN_FUTURES
universe_id: cn_commodity_actual_contracts_core
benchmark_symbol: RB_CONT
lifecycle:
  role: simulated
  line_id: cn_futures_daily_trend_sim
futures:
  contract_spec_path: configs/instruments/products
  ctp_contract_mapping_path: configs/instruments/ctp_sim.yaml
  # 当前没有经授权的 runtime Calendar Snapshot，故 live execute 必须失败关闭。
  # 按交易所填写不可变 ArtifactSnapshot hash；本仓库当前没有已授权的运行时日历制品，故保持空映射并阻断提交。
  calendar_artifact_snapshot_hashes: {}
  symbols_are_continuous: false
  execution_allowed: true
execution:
  long_only: false
  rebalance_min_trade_value: 0
  rebalance_weight_tolerance: 0.0
  order_qty_step: 1
backtest:
  engine: futures_daily
  initial_cash: 1000000
  commission_bps: 0.0
  min_commission: 0.0
  slippage_bps: 0.0
  slippage_ticks: 1.0
  max_volume_participation: 0.05
  lot_size: 1
  execution_delay_sessions: 1
  sellable_after_sessions: 0
versions:
  profile: cn-futures-ctp-sim-v1
  benchmark: adjusted-active-contract-chain-v1
  strategy_params: futures-trend-60d-v1
  execution_policy: ctp-sim-explicit-offset-v1
  risk_policy: futures-margin-allocation-v1
portfolio_risk_approval:
  policy_id: ctp-sim-portfolio-risk-v1
  policy_version: futures-margin-allocation-v1
  max_input_age_seconds: 300
  manual_approval_verifier_id: ctp-sim-manual-risk-verifier-v1
  authorized_approver_ids: [risk-owner]
  limits:
    per_contract: 1.0
    per_commodity: 1.0
    per_sector: 1.0
    per_exchange: 1.0
    per_strategy: 1.0
    per_account: 1.0
    gross_leverage: 2.0
    net_leverage: 1.0
    margin_utilization: 0.8
  scenarios:
    - kind: gap
      scenario_id: ctp-sim-gap-v1
      shock_fraction: 0.1
      max_loss_fraction: 0.5
      max_margin_utilization: 0.8
    - kind: limit_move
      scenario_id: ctp-sim-limit-move-v1
      shock_fraction: 0.1
      max_loss_fraction: 0.5
      max_margin_utilization: 0.8
    - kind: volatility_shock
      scenario_id: ctp-sim-volatility-shock-v1
      shock_fraction: 0.1
      max_loss_fraction: 0.5
      max_margin_utilization: 0.8
    - kind: liquidity_collapse
      scenario_id: ctp-sim-liquidity-collapse-v1
      shock_fraction: 0.1
      max_loss_fraction: 0.5
      max_margin_utilization: 0.8
    - kind: correlated_commodity_shock
      scenario_id: ctp-sim-correlated-commodity-shock-v1
      shock_fraction: 0.1
      max_loss_fraction: 0.5
      max_margin_utilization: 0.8
    - kind: margin_increase
      scenario_id: ctp-sim-margin-increase-v1
      shock_fraction: 0.1
      max_loss_fraction: 0.5
      max_margin_utilization: 0.8
    - kind: fx_shock
      scenario_id: ctp-sim-fx-shock-v1
      shock_fraction: 0.1
      max_loss_fraction: 0.5
      max_margin_utilization: 0.8
  taxonomy:
    rb:
      commodity_id: rb
      sector_id: ferrous
      correlation_cluster_id: ferrous-steel
    cu:
      commodity_id: cu
      sector_id: nonferrous
      correlation_cluster_id: china-metals
    ta:
      commodity_id: ta
      sector_id: chemicals
      correlation_cluster_id: china-chemicals
    sa:
      commodity_id: sa
      sector_id: chemicals
      correlation_cluster_id: china-chemicals
    sc:
      commodity_id: sc
      sector_id: energy
      correlation_cluster_id: china-energy
  ctp_sim_execution_rules:
    rb:
      margin_rate: 0.1
      max_position_lots: 100
    cu:
      margin_rate: 0.1
      max_position_lots: 100
    ta:
      margin_rate: 0.1
      max_position_lots: 100
    sa:
      margin_rate: 0.1
      max_position_lots: 100
    sc:
      margin_rate: 0.1
      max_position_lots: 100
data:
  provider: akshare_actual_daily
  source_id: akshare_actual_daily_public_v1
  dataset_id: akshare_actual_contracts_simulated_v1
  live_trading_eligible: false
  path: cn/futures/1d/actual_contracts_simulated.parquet
  price_field: close
  adjusted: true
  download:
    enabled: true
    provider: akshare_actual_daily
    symbols: [RB, CU, TA, SA, SC]
    start_date: "2026-03-26"
    options:
      product_exchanges:
        RB: SHFE
        CU: SHFE
        TA: CZCE
        SA: CZCE
        SC: INE
      research_position_limit_lots:
        RB: 100
        CU: 100
        TA: 100
        SA: 100
        SC: 100
      request_interval_seconds: 0.2
research_admission:
  # 本地 CTP 语义演练不由研究准入结论自动放行。
  enabled: false
  policy_id: null
strategies:
  - strategy_id: futures_trend
    strategy_family: trend_following
    enabled: true
    capital_weight: 1.0
    params:
      lookback_days: 60
risk:
  max_single_weight: 0.25
  max_gross_exposure: 0.8
  min_cash_buffer: 0.15
  max_order_notional: 2000000
  max_order_qty: 100
  enforce_available_cash: true
  enforce_tradeable_state: true
  enforce_price_limit: true
  long_only: false
schedule:
  daily_signal_cron: "20 15 * * 1-5"
  execution_cron: "5 9,21 * * 1-5"
  runtime_risk_cron: "*/1 * * * 1-5"
