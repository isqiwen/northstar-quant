# 实际合约分钟订单回放画像。
profile_id: cn_futures_intraday_replay_offline
name: 中国商品期货实际合约分钟订单回放
market: CN
asset_type: FUTURES
data_frequency: 1m
rebalance_frequency: 1d
strategy_family: trend_following
currency: CNY
timezone: Asia/Shanghai
calendar: CN_FUTURES
universe_id: cn_commodity_actual_contracts_intraday
benchmark_symbol: RB_CONT
lifecycle:
  role: research
  line_id: cn_futures_intraday_replay_research
futures:
  contract_spec_path: configs/instruments/products
  ctp_contract_mapping_path: configs/instruments/ctp.yaml
  symbols_are_continuous: false
  execution_allowed: false
execution:
  long_only: false
  rebalance_min_trade_value: 0
  rebalance_weight_tolerance: 0.0
  order_qty_step: 1
backtest:
  engine: futures_intraday_replay
  initial_cash: 1000000
  commission_bps: 0.0
  min_commission: 0.0
  slippage_bps: 0.0
  slippage_ticks: 1.0
  max_volume_participation: 0.05
  lot_size: 1
  execution_delay_sessions: 1
  sellable_after_sessions: 0
  # 未完全成交委托最多保留 5 根该合约分钟线。
  order_ttl_bars: 5
  # 被动限价单假设前方排队量为触价分钟成交量的 25%。
  queue_ahead_ratio: 0.25
versions:
  profile: cn-futures-intraday-replay-v1
  benchmark: adjusted-active-contract-chain-v1
  strategy_params: futures-trend-60d-v1
  execution_policy: top-of-book-minute-replay-v1
  risk_policy: futures-margin-allocation-v1
data:
  provider: local_actual_contracts
  # 本地导入文件的上游授权必须单独核验，不能因通过 schema 就变成候选研究数据。
  source_id: local_actual_contracts_import_v1
  dataset_id: actual_contracts_intraday_quotes_v1
  live_trading_eligible: false
  path: cn/futures/1m/actual_contracts.parquet
  # 原始撮合数据是 1m，策略信号由实际合约分钟线聚合为 1d。
  signal_frequency: 1d
  price_field: close
  adjusted: true
  download:
    enabled: false
    provider: local_actual_contracts
    symbols: []
research_admission:
  enabled: true
  policy_id: cn_commodity_futures_research_conservative_v1
strategies:
  - strategy_id: futures_trend
    strategy_family: trend_following
    enabled: true
    capital_weight: 1.0
    params:
      lookback_days: 60
risk:
  max_single_weight: 0.25
  max_gross_exposure: 0.8
  min_cash_buffer: 0.0
schedule:
  shadow_run_cron: "30 15 * * 1-5"
  daily_report_cron: "45 15 * * 1-5"
