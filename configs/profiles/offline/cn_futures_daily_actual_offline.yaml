# 实际合约链离线回测画像。
#
# AKShare 提供交易所实际合约日线；金十主力参考规则用于离线研究中的保证金、手续费和
# 涨跌停模拟。公开规则只有主力合约粒度，因此这仍不是实盘合格数据。
profile_id: cn_futures_daily_actual_offline
name: 中国商品期货实际合约日线回测
market: CN
asset_type: FUTURES
data_frequency: 1d
rebalance_frequency: 1d
strategy_family: trend_following
currency: CNY
timezone: Asia/Shanghai
# 实际数据必须按交易日字段归属完整覆盖夜盘与日盘；此 ID 仅用于画像标识。
calendar: CN_FUTURES
universe_id: cn_commodity_actual_contracts_core
benchmark_symbol: RB_CONT
lifecycle:
  role: research
  line_id: cn_futures_daily_actual_research
futures:
  # 静态乘数和最小变动价位来自品种卡；动态参数必须来自数据集逐日快照。
  contract_spec_path: configs/instruments/products
  contract_authority_id: cn_futures
  symbols_are_continuous: false
  # 实际合约离线回测不等于授权实盘执行。
  execution_allowed: false
execution:
  long_only: false
  rebalance_min_trade_value: 0
  rebalance_weight_tolerance: 0.0
  order_qty_step: 1
backtest:
  engine: futures_daily
  initial_cash: 1000000
  # 手续费来自逐日规则快照，以下通用成本字段必须保持为 0，避免重复计费。
  commission_bps: 0.0
  min_commission: 0.0
  slippage_bps: 0.0
  # 每次成交按不利方向移动一档。
  slippage_ticks: 1.0
  # 单日单合约最多使用成交量的 5%，超出部分按未成交处理。
  max_volume_participation: 0.05
  lot_size: 1
  execution_delay_sessions: 1
  sellable_after_sessions: 0
versions:
  profile: cn-futures-actual-daily-v1
  benchmark: adjusted-active-contract-chain-v1
  strategy_params: futures-trend-60d-v1
  execution_policy: actual-contract-daily-rules-v1
  risk_policy: futures-margin-allocation-v1
data:
  provider: akshare_actual_daily
  # 当前公开数据只用于工程验收；候选策略准入会要求另行授权的商业实际合约数据。
  source_id: akshare_actual_daily_public_v1
  dataset_id: akshare_actual_contracts_with_reference_rules_v1
  live_trading_eligible: false
  path: cn/futures/1d/actual_contracts.parquet
  # 策略层由实际主力合约单日收益构造调整后的连续指数。
  price_field: close
  adjusted: true
  download:
    enabled: true
    provider: akshare_actual_daily
    # 暂不纳入 DCE：其公开接口当前受反爬限制；GFEX 历史日期返回口径仍需额外核验。
    symbols: [RB, CU, TA, SA, SC]
    # 金十参考规则在 2026-03-23、2026-03-24 无快照；从下一段连续区间开始。
    start_date: "2026-03-26"
    end_date: "2026-06-30"
    options:
      product_exchanges:
        RB: SHFE
        CU: SHFE
        TA: CZCE
        SA: CZCE
        SC: INE
      # 这是研究组合的硬上限，不冒充交易所或期货公司的逐日限仓规则。
      research_position_limit_lots:
        RB: 100
        CU: 100
        TA: 100
        SA: 100
        SC: 100
      request_interval_seconds: 0.2
research_admission:
  enabled: true
  policy_id: cn_commodity_futures_research_conservative_v1
strategies:
  - strategy_id: futures_trend
    strategy_family: trend_following
    enabled: true
    capital_weight: 1.0
    params:
      lookback_days: 60
risk:
  max_single_weight: 0.25
  max_gross_exposure: 0.8
  min_cash_buffer: 0.0
schedule:
  shadow_run_cron: "30 15 * * 1-5"
  daily_report_cron: "45 15 * * 1-5"
