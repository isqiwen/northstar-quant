# 本地 CTP 语义仿真柜台映射。
#
# 该文件只允许由 NORTHSTAR_BROKER=ctp_sim 使用，不是期货公司真实账户白名单。
# 合约换月后必须同步更新 data_symbol 和 instrument_id，不能把连续合约直接报入柜台。
version: 1
broker: ctp_sim
contracts:
  - continuous_symbol: CU_CONT
    data_symbol: CU2608
    instrument_id: cu2608
    exchange_id: SHFE
    product_id: cu
    volume_multiple: 5
    price_tick: 10
    trading_enabled: true
  - continuous_symbol: RB_CONT
    data_symbol: RB2610
    instrument_id: rb2610
    exchange_id: SHFE
    product_id: rb
    volume_multiple: 10
    price_tick: 1
    trading_enabled: true
  - continuous_symbol: SA_CONT
    data_symbol: SA609
    instrument_id: sa609
    exchange_id: CZCE
    product_id: sa
    volume_multiple: 20
    price_tick: 1
    trading_enabled: true
  - continuous_symbol: SC_CONT
    data_symbol: SC2608
    instrument_id: sc2608
    exchange_id: INE
    product_id: sc
    volume_multiple: 1000
    price_tick: 0.1
    trading_enabled: true
  - continuous_symbol: TA_CONT
    data_symbol: TA609
    instrument_id: ta609
    exchange_id: CZCE
    product_id: ta
    volume_multiple: 5
    price_tick: 2
    trading_enabled: true
