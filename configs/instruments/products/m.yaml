# 豆粕（M）品种卡。
# 品种卡结构版本；加载器目前只接受 1。
version: 1
# 稳定品种代码，不含具体合约交割年月。
product: M
# 面向报告和人工核验的中文名称。
name: 豆粕
# 交易所标准代码；DCE 表示大连商品交易所。
exchange: DCE
# 相对稳定的标准合约规格。
contract:
  # 一手代表 10 吨豆粕；用于盈亏和保证金计算。
  multiplier: 10
  # 最小报价变动，单位为元/吨。
  tick_size: 1.0
  # 大商所豆粕仅在这些月份挂牌，不应假设每个自然月都有 M 合约。
  delivery_months: [1, 3, 5, 7, 8, 9, 11, 12]
trading:
  # 交易时点按中国标准时间解释。
  timezone: Asia/Shanghai
  # 存在夜盘；时段必须按每日通知读取。
  has_night_session: true
  # 缺少日度时段快照时禁止执行。
  session_rule: exchange_daily_schedule
delivery:
  # 最后交易日按交易所具体合约规则计算。
  last_trade_day_rule: exchange_contract_specification
  # 个人投资者交割月限制须由券商和交易所当日规则确认。
  individual_investor_rule: broker_and_exchange_delivery_month_restriction
roll:
  # 换月必须基于显式具体合约链。
  method: explicit_daily_contract_chain
  # 流动性指标只用于候选筛选。
  reference_signals: [open_interest, volume, term_liquidity]
risk:
  # 以下均为日度动态事实，不在静态 YAML 中写死数值。
  dynamic_snapshot: [trading_sessions, margin_rate, commission, price_limits, position_limits, active_contract]
research:
  # 豆粕从大豆压榨到养殖饲料消费的产业链。
  industry_chain: 进口和国产大豆压榨后形成豆粕，主要进入生猪、禽类和水产饲料。
  # 研究需跟踪的供需变量。
  supply_demand_drivers: 美豆和南美产量、进口到港、压榨利润、养殖利润和饲料需求。
  # 典型突发与宏观风险。
  event_risks: 南北美天气、贸易政策、检疫和港口扰动、疫病、汇率与航运风险。
sources:
  # 合约和业务规则权威入口。
  exchange: https://www.dce.com.cn/
  # 动态规则日度核验来源。
  daily_rule_source: exchange_and_broker_daily_notice
