# 原油（SC）品种卡。
version: 1
product: SC
name: 原油
exchange: INE
contract:
  multiplier: 1000
  tick_size: 0.1
  delivery_month_rule: exchange_contract_specification
trading:
  timezone: Asia/Shanghai
  has_night_session: true
  session_rule: exchange_daily_schedule
delivery:
  last_trade_day_rule: exchange_contract_specification
  individual_investor_rule: broker_and_exchange_delivery_month_restriction
roll:
  method: explicit_daily_contract_chain
  reference_signals: [open_interest, volume, term_liquidity]
risk:
  dynamic_snapshot: [trading_sessions, margin_rate, commission, price_limits, position_limits, active_contract]
research:
  industry_chain: 海外原油生产、运输与进口进入炼化，影响成品油、化工品和全球能源价格。
  supply_demand_drivers: OPEC+ 政策、全球库存、炼厂开工、航运、美元和全球经济活动。
  event_risks: 地缘冲突、制裁、海峡与航运中断、OPEC+ 突发决策、极端库存和宏观冲击。
sources:
  exchange: https://www.ine.cn/
  daily_rule_source: exchange_and_broker_daily_notice
