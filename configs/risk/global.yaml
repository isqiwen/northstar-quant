# 全局风险设计样例。
#
# 当前风险检查读取交易画像的 risk 段及环境安全开关，本文件尚未接入运行时；所以它
# 不能被视为真实账户的已生效风险限额。正式接入前应定义与画像风险的覆盖优先级。
risk:
  # 组合绝对权重总和上限；1.0 表示 100% 名义风险暴露，不等同于期货保证金占用。
  max_gross_exposure: 1.0
  # 单一持仓的最大绝对权重。
  max_single_position_weight: 0.35
  # 单日净值最大允许损失比例；超过时未来应阻断新开仓并触发告警。
  max_daily_loss_pct: 0.03
  # 从历史峰值开始的最大允许回撤比例；超过时未来应进入风险降级状态。
  max_drawdown_pct: 0.15
  # 执行异常时是否建议立即启用 kill switch；真正的 kill switch 仍由环境变量控制。
  kill_switch_on_error: true
