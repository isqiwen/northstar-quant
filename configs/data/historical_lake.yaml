# Historical Parquet Lake 是不可变证据层；本配置禁止自动删除。每类数据必须有逐行 available_at，
# DuckDB 只会在明确 as_of 时读取 available_at 不晚于该时点的行。
version: 1
retention:
  automatic_cleanup: false
dataset_kinds:
  tick:
    partition_columns: [symbol]
    available_at_column: available_at
  bars:
    partition_columns: [symbol]
    available_at_column: available_at
  factors:
    partition_columns: [factor_id]
    available_at_column: available_at
  features:
    partition_columns: [feature_id]
    available_at_column: available_at
  research:
    partition_columns: [run_id]
    available_at_column: available_at
  backtest:
    partition_columns: [run_id]
    available_at_column: available_at
