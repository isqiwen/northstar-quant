# PostgreSQL 备份与恢复就绪证据策略。
#
# 此文件不会创建、上传或删除任何备份。它只让 `northstar ops backup status` 和
# `northstar health` 读取外部备份系统在 runtime.storage_dir 下留下的无秘密证据。
# 默认关闭，因此不能把当前项目误认为已经具备自动备份或灾难恢复能力。
version: 1
enabled: false

# 相对 runtime.storage_dir 的安全路径。证据文件不得包含数据库 URL、对象存储地址、
# 令牌、账户号或其他凭据；详见 docs/OPERATIONS.md。
evidence_relative_path: operations/database-backup/readiness.json

# 启用后，证据中的最近逻辑备份与最近隔离恢复演练不得超过以下时效。
max_backup_age_hours: 26
max_restore_verification_age_days: 31
