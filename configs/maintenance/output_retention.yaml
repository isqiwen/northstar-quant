# 运行输出清理策略。
#
# 此配置不会触发自动删除。默认 disabled 时，命令只允许 dry-run 预览；即使用户传入
# --apply 也会失败关闭。要真正删除下载缓存，必须同时把 enabled 改为 true，并显式传入
# --apply。供应商 license.retention_days 与本文件没有任何关系，不能据此推断删除时点。
version: 1
enabled: false

# 只针对 NORTHSTAR_DOWNLOADS_DIR 下的下载缓存，不涉及 storage/market、reports 或日志。
download_cache_retention_days: 30

# 只匹配本项目原子写入流程遗留的 .<target>.<random>.tmp 文件。
temporary_file_retention_days: 7
