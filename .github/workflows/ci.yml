name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-platform:
    name: Linux 主平台：完整测试、数据库与部署契约
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: northstar
          POSTGRES_PASSWORD: northstar_ci_password # secret-scan: allow; reason: disposable CI service credential
          POSTGRES_DB: northstar
        ports:
          - 5432:5432
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U northstar -d northstar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NORTHSTAR_ENV: test
      NORTHSTAR_DATABASE_URL: postgresql+psycopg://northstar:northstar_ci_password@127.0.0.1:5432/northstar # secret-scan: allow; reason: disposable CI service credential
      NORTHSTAR_TEST_DATABASE_URL: postgresql+psycopg://northstar:northstar_ci_password@127.0.0.1:5432/northstar_test # secret-scan: allow; reason: disposable CI service credential
      NORTHSTAR_BROKER: paper
      NORTHSTAR_LIVE_TRADING_ENABLED: "false"
      NORTHSTAR_KILL_SWITCH_ENABLED: "false"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 创建完整活动配置
        run: |
          cp configs/app.example.yaml configs/app.yaml
          cp .env.example .env

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 配置 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # This checker is standard-library-only. It must run before the hermetic
      # bootstrap so an unreviewed source cannot be downloaded or built first.
      - name: 验证离线依赖完整性（安装前）
        run: |
          python scripts/ci/check_dependency_policy.py
          uv lock --check --offline
          python scripts/ci/check_secrets.py

      - name: 配置 just
        uses: extractions/setup-just@v3

      - name: 在 fresh venv 中 bootstrap 受审计的 PEP 517 输入
        run: python scripts/ci/bootstrap_pep517.py --profile ci

      - name: 安装与 CI PostgreSQL 服务匹配的客户端
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-16

      - name: 验证 PostgreSQL 恢复演练客户端和服务端 major 版本
        env:
          PGPASSWORD: northstar_ci_password # secret-scan: allow; reason: disposable CI service credential
        run: |
          command -v pg_dump
          command -v pg_restore
          command -v psql
          pg_dump --version | grep -E '^pg_dump \(PostgreSQL\) 16\.'
          pg_restore --version | grep -E '^pg_restore \(PostgreSQL\) 16\.'
          psql --version | grep -E '^psql \(PostgreSQL\) 16\.'
          server_version_num="$(psql -h 127.0.0.1 -p 5432 -U northstar -d northstar -Atqc 'SHOW server_version_num')"
          test "${server_version_num}" -ge 160000
          test "${server_version_num}" -lt 170000

      - name: 验证统一 just 命令面
        run: |
          just --list
          just dev-check

      - name: 创建隔离测试数据库
        env:
          PGPASSWORD: northstar_ci_password # secret-scan: allow; reason: disposable CI service credential
        run: >-
          psql -h 127.0.0.1 -p 5432 -U northstar -d postgres
          -v ON_ERROR_STOP=1 -c "CREATE DATABASE northstar_test;"

      - name: 验证 Alembic 迁移
        run: uv run --offline --no-sync alembic upgrade head

      - name: 验证 Linux 部署契约
        run: uv run --offline --no-sync pytest tests/foundation/contract/test_deploy_scripts.py -q

      - name: 运行完整 pytest（含 integration）
        run: uv run --offline --no-sync pytest

      - name: 验证 P8 候选证据矩阵（仅 offline / paper / ctp_sim）
        run: just candidate-acceptance

      - name: 运行跨平台静态检查
        run: just check

      - name: 验证 Pull Request 未新增类型错误
        if: github.event_name == 'pull_request'
        run: >-
          uv run --offline --no-sync python scripts/ci/check_mypy_baseline.py ratchet
          --base-revision "${{ github.event.pull_request.base.sha }}"

  windows-workstation:
    name: Windows 工作站：单元、回测、CLI 与开发脚本
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NORTHSTAR_ENV: test
      NORTHSTAR_BROKER: paper
      NORTHSTAR_LIVE_TRADING_ENABLED: "false"
      NORTHSTAR_KILL_SWITCH_ENABLED: "false"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 创建活动配置（不启动 Docker 或服务）
        shell: pwsh
        run: |
          Copy-Item .env.example .env
          Copy-Item configs/app.example.yaml configs/app.yaml

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 配置 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # This checker is standard-library-only. It must run before the hermetic
      # bootstrap so an unreviewed source cannot be downloaded or built first.
      - name: 验证离线依赖完整性（安装前）
        shell: pwsh
        run: |
          python scripts/ci/check_dependency_policy.py
          uv lock --check --offline
          python scripts/ci/check_secrets.py

      - name: 配置 just
        uses: extractions/setup-just@v3

      - name: 在 fresh venv 中 bootstrap 受审计的 PEP 517 输入
        run: python scripts/ci/bootstrap_pep517.py --profile ci

      - name: 验证统一 just 命令面
        run: |
          just --list
          just dev-check

      - name: 运行 Windows 单元测试
        run: just test-unit

      - name: 运行 Windows 回测测试
        run: just test-backtest

      - name: 运行 CLI 与开发脚本契约
        shell: pwsh
        run: |
          just test-cli
          uv run --offline --no-sync pytest tests/foundation/contract/test_cross_platform_scripts.py tests/architecture -q

      - name: 运行跨平台静态检查
        run: just check
