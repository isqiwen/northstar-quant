name: application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: northstar_quant_test
          POSTGRES_USER: northstar_test
          POSTGRES_PASSWORD: northstar_test_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U northstar_test -d northstar_quant_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      NORTHSTAR_TEST_DATABASE_URL: postgresql+psycopg://northstar_test:northstar_test_only@127.0.0.1:5432/northstar_quant_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.33"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install PostgreSQL 17 maintenance client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
      - name: Verify source and behavior
        run: make verify
      - name: Verify checks leave the source tree clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo 'Verification changed the source tree:'
            printf '%s\n' "$changes"
            exit 1
          fi
      - name: Build and verify the installed wheel
        run: |
          uv build --project backend --wheel --out-dir "$RUNNER_TEMP/northstar-dist"
          uv export --project backend --locked --no-dev --no-emit-project --output-file "$RUNNER_TEMP/northstar-runtime.txt"
          uv venv --no-project --python 3.12 "$RUNNER_TEMP/northstar-installed"
          uv pip install --python "$RUNNER_TEMP/northstar-installed/bin/python" --require-hashes --no-deps --requirements "$RUNNER_TEMP/northstar-runtime.txt"
          uv pip install --python "$RUNNER_TEMP/northstar-installed/bin/python" --no-deps "$RUNNER_TEMP"/northstar-dist/*.whl
          uv pip check --python "$RUNNER_TEMP/northstar-installed/bin/python"
          "$RUNNER_TEMP/northstar-installed/bin/python" scripts/check_install.py examples/intraday.toml
      - name: Verify all three applications in an isolated browser
        run: |
          uv run --project backend --with playwright==1.62.0 python -m playwright install --with-deps chromium
          uv run --project backend --with playwright==1.62.0 python scripts/check_browser.py --executable "$RUNNER_TEMP/northstar-installed/bin/northstar" --study examples/intraday.toml --screenshot "$RUNNER_TEMP/northstar-factor-browser.png"
      - name: Build and verify the runtime image
        run: |
          export NORTHSTAR_GIT_REVISION="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain --untracked-files=all)"
          docker compose -f deploy/storage/compose.yaml config --quiet
          docker compose -f deploy/data_hub/compose.yaml config --quiet
          docker compose -f deploy/research/compose.yaml config --quiet
          docker compose -f deploy/live/compose.yaml config --quiet
          docker compose -f deploy/storage/compose.yaml build initialize
          docker tag northstar-quant:local northstar-local
          docker build -f frontend/Dockerfile --build-arg APP=live -t northstar-live-frontend:check .
          docker build -f frontend/Dockerfile --build-arg APP=data_hub -t northstar-data-frontend:check .
          docker build -f frontend/Dockerfile --build-arg APP=research -t northstar-research-frontend:check .
          docker run --rm --network host \
            --cpus 2 --memory 1g --memory-swap 1g --pids-limit 128 \
            --log-driver local --log-opt max-size=10m --log-opt max-file=3 \
            --env NORTHSTAR_TEST_DATABASE_URL \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts,target=/tmp/install-check,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/examples,target=/tmp/examples,readonly" \
            northstar-local /app/.venv/bin/python /tmp/install-check/check_install.py /tmp/examples/intraday.toml
      - name: Verify independent Data Hub and Research deployments
        run: uv run --project backend python scripts/check_application_deployment.py --image northstar-local --data-image northstar-data-frontend:check --research-image northstar-research-frontend:check
      - name: Verify the isolated Live deployment and failure behavior
        run: uv run --project backend python scripts/check_live_deployment.py --image northstar-local --frontend-image northstar-live-frontend:check
