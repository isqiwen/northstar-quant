name: northstar-personal
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: northstar_quant
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: northstar_local
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar -d northstar_quant"]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      NORTHSTAR_DATABASE_URL: postgresql+psycopg://northstar:northstar_local@postgres:5432/northstar_quant
      NORTHSTAR_DATA_DIR: /var/lib/northstar/sources
    volumes:
      - source-data:/var/lib/northstar/sources
      - backup-data:/var/lib/northstar/backups
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:18080"
    command: ["sh", "-c", "northstar init-db && exec uvicorn northstar_quant.web:application --factory --host 0.0.0.0 --port 18080"]
volumes:
  postgres-data:
  source-data:
  backup-data:
