name: northstar-personal
x-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
services:
  postgres:
    networks: [storage]
    image: postgres:17-alpine
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    logging: *bounded-logging
    environment:
      POSTGRES_DB: northstar_quant
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: northstar_local
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar -d northstar_quant"]
      interval: 2s
      timeout: 3s
      retries: 20
  initialize:
    networks: [storage]
    platform: linux/amd64
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
        NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
    image: northstar-quant:local
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    logging: *bounded-logging
    environment:
      NORTHSTAR_DATABASE_URL: postgresql+psycopg://northstar:northstar_local@postgres:5432/northstar_quant
      NORTHSTAR_DATA_DIR: /var/lib/northstar/sources
    volumes:
      - source-data:/var/lib/northstar/sources
      - runtime-auth:/var/lib/northstar/auth
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "northstar maintenance init-db && northstar maintenance init-auth /var/lib/northstar/auth && python -c 'from northstar_quant.data_management.files import SourceFiles; SourceFiles.from_environment()'"]
  live:
    networks: [storage, management, egress]
    platform: linux/amd64
    build:
      context: .
      args:
        NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
        NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
    image: northstar-quant:local
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    logging: *bounded-logging
    environment:
      NORTHSTAR_DATABASE_URL: postgresql+psycopg://northstar:northstar_local@postgres:5432/northstar_quant
      NORTHSTAR_DATA_DIR: /var/lib/northstar/sources
      NORTHSTAR_LIVE_AUTH: /var/lib/northstar/auth/live.toml
      NORTHSTAR_LIVE_URL: http://127.0.0.1:18081
    volumes:
      - source-data:/var/lib/northstar/sources
      - runtime-auth:/var/lib/northstar/auth:ro
    depends_on:
      initialize:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:18081:18081"
    command: ["uvicorn", "northstar_quant.apps.live.kernel:application", "--factory", "--host", "0.0.0.0", "--port", "18081"]
    healthcheck:
      test: ["CMD", "northstar", "status"]
      interval: 10s
      timeout: 8s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
  live-api:
    networks: [management, live-frontend]
    platform: linux/amd64
    build:
      context: .
      args:
        NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
        NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
    image: northstar-quant:local
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    logging: *bounded-logging
    environment:
      NORTHSTAR_LIVE_URL: http://live:18081
      NORTHSTAR_LIVE_AUTH: /var/lib/northstar/auth/live-web.toml
    volumes:
      - runtime-auth:/var/lib/northstar/auth:ro
    depends_on:
      initialize:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:19080:19080"
    command: ["uvicorn", "northstar_quant.apps.live:application", "--factory", "--host", "0.0.0.0", "--port", "19080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19080/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
  data-api:
    networks: [storage, data-frontend]
    platform: linux/amd64
    build:
      context: .
      args:
        NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
        NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
    image: northstar-quant:local
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      NORTHSTAR_DATABASE_URL: postgresql+psycopg://northstar:northstar_local@postgres:5432/northstar_quant
      NORTHSTAR_DATA_DIR: /var/lib/northstar/sources
    volumes:
      - source-data:/var/lib/northstar/sources
      - backup-data:/var/lib/northstar/backups
    depends_on:
      initialize:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:19082:19082"
    command: ["uvicorn", "northstar_quant.apps.data_hub:application", "--factory", "--host", "0.0.0.0", "--port", "19082"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19082/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  research-api:
    networks: [storage, research-frontend]
    platform: linux/amd64
    build:
      context: .
      args:
        NORTHSTAR_GIT_REVISION: ${NORTHSTAR_GIT_REVISION:-}
        NORTHSTAR_DEVELOPMENT_BUILD: ${NORTHSTAR_DEVELOPMENT_BUILD:-0}
    image: northstar-quant:local
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      NORTHSTAR_DATABASE_URL: postgresql+psycopg://northstar:northstar_local@postgres:5432/northstar_quant
      NORTHSTAR_DATA_DIR: /var/lib/northstar/sources
    volumes:
      - source-data:/var/lib/northstar/sources:ro
    depends_on:
      initialize:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:19084:19084"
    command: ["uvicorn", "northstar_quant.apps.research:application", "--factory", "--host", "0.0.0.0", "--port", "19084"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19084/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  data-hub:
    networks: [data-frontend, ingress]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP: data_hub
    image: northstar-data_hub-frontend:local
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      NORTHSTAR_API_URL: http://data-api:19082
    ports:
      - "127.0.0.1:18082:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  research:
    networks: [research-frontend, ingress]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP: research
    image: northstar-research-frontend:local
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      NORTHSTAR_API_URL: http://research-api:19084
    ports:
      - "127.0.0.1:18084:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  live-web:
    networks: [live-frontend, ingress]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP: live
    image: northstar-live-frontend:local
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      NORTHSTAR_API_URL: http://live-api:19080
    ports:
      - "127.0.0.1:18080:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
  source-data:
  backup-data:
  runtime-auth:

networks:
  storage:
    internal: true
  management:
    internal: true
  live-frontend:
    internal: true
  data-frontend:
    internal: true
  research-frontend:
    internal: true
  egress:
  ingress:
