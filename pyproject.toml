[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-quant"
version = "0.1.0"
description = "Northstar Quant：面向个人量化研究者的现代化终极项目骨架"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenAI" }
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "polars>=1.0",
  "pyarrow>=17.0",
  "akshare>=1.18",
  "pandas>=2.2",
  "numpy>=1.26",
  "apscheduler>=3.10",
  "structlog>=24.1",
  "python-dotenv>=1.0",
  "matplotlib>=3.9",
  "plotly>=5.23",
  "httpx>=0.27",
  "tenacity>=8.5",
  "pyyaml>=6.0.2",
  "jinja2>=3.1",
  "markdown>=3.7",
  "streamlit>=1.38",
  "exchange-calendars>=4.5",
  "reportlab>=4.2",
]


[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.11",
]

# This is deliberately a PEP 735 dependency group rather than a distributable
# project extra.  The hermetic PEP 517 bootstrap installs it into a fresh venv
# before it materializes any source distribution or the local project.
[dependency-groups]
build-bootstrap = [
  "setuptools==80.9.0",
  "wheel==0.45.1",
]

[project.scripts]
northstar = "northstar_quant.application.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
  "unit: 不访问真实数据库或外部服务的快速测试",
  "integration: 使用 PostgreSQL 或验证多个模块协作的集成测试",
  "contract: 验证架构、迁移、CLI 和运维脚本契约",
  "e2e: 验证完整业务闭环的端到端测试",
  "golden: 验证固定输入的语义输出，防止静默漂移",
  "regression: 验证相同数据、配置与代码下的研究结果稳定性",
  "statistical: 验证统计假设、点时正确性与研究有效性",
  "scenario: 验证组合与风险的压力情景",
  "simulation: 验证执行和 broker 的模拟行为",
  "failure: 验证失败关闭与故障恢复行为",
]

[tool.mypy]
python_version = "3.11"
platform = "linux"
show_error_codes = true
pretty = false
color_output = false
error_summary = false
