# Broker credentials belong only to Live; never mount them into any Web process.
# Run uv run --project backend python scripts/operations/setup_simnow.py locally first; this file contains no account secrets.
services:
  live:
    environment:
      NORTHSTAR_SIMNOW_CONFIG: /run/secrets/simnow
    secrets:
      - simnow
secrets:
  simnow:
    file: ./.northstar/simnow.env
